<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星火聊天室 · 腾讯云版</title>
<style>
/* ==================== 样式：前端同学负责这一段 ==================== */
:root{
  --primary:#6d5efc;--primary2:#5a49f0;--soft:#efecff;--bg:#f5f6fb;
  --card:#fff;--text:#1f2333;--muted:#8b90a5;--border:#e6e8f0;
  --ai:#f0edff;--danger:#e25656;--ok:#38b97f;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font-family:inherit}

/* 入口页 */
.entry{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 18% 12%,#e9e5ff 0%,transparent 42%),
             radial-gradient(circle at 85% 88%,#dfefff 0%,transparent 42%),var(--bg)}
.card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);
  border-radius:22px;padding:40px 38px 30px;box-shadow:0 24px 60px rgba(70,55,140,.14)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#8b7cff,#5a49f0);
  color:#fff;font-size:27px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(109,94,252,.38)}
.logo.sm{width:38px;height:38px;font-size:20px;border-radius:12px}
.bname{font-size:21px;font-weight:750;letter-spacing:.3px}
.bsub{font-size:12px;color:var(--muted);margin-top:3px}
.intro{font-size:13px;color:var(--muted);line-height:1.7;margin:22px 0 20px}
.field-label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:600}
.nick-input{width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:12px;
  font-size:15px;outline:none;background:#fbfbfe;transition:.18s}
.nick-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--soft)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:9px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:650;
  cursor:pointer;background:linear-gradient(135deg,#7c6cff,#5a49f0);box-shadow:0 8px 20px rgba(109,94,252,.32);transition:.18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(109,94,252,.42)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.foot{margin-top:20px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--ok)}
.switch-line{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
.switch-line a{color:var(--primary);font-weight:650;text-decoration:none;cursor:pointer}
.switch-line a:hover{text-decoration:underline}

/* 聊天页 */
.chat{display:flex;height:100vh}
.side{width:256px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 16px}
.side-head{display:flex;align-items:center;gap:12px;padding:4px 4px 20px}
.sec-label{font-size:11px;color:var(--muted);margin:16px 6px 8px;letter-spacing:.5px;font-weight:600}
.me{display:flex;align-items:center;gap:10px;padding:10px;background:#f7f7fc;border-radius:12px}
.avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#8b7cff,#6352f5);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:15px}
.me-name{font-size:14px;font-weight:700}
.me-id{font-size:11px;color:var(--muted);margin-top:2px}
.nav{width:100%;text-align:left;padding:11px 12px;border:none;border-radius:10px;background:transparent;
  color:var(--text);font-size:14px;cursor:pointer;margin-bottom:4px;transition:.15s}
.nav:hover{background:#f5f5fa}
.nav.active{background:var(--soft);color:var(--primary);font-weight:650}
.nav.ai{color:var(--primary)}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border)}
.btn-quiet{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;
  color:var(--muted);cursor:pointer;font-size:13px;transition:.15s}
.btn-quiet:hover{color:var(--danger);border-color:var(--danger)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.head{height:72px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.title{font-size:17px;font-weight:750}
.desc{display:none;font-size:12px;color:var(--muted);margin-top:3px}
.badge{font-size:12px;padding:6px 12px;border-radius:20px;font-weight:650;
  color:var(--primary);background:var(--soft)}
.badge.local{color:#b8860b;background:#fff6e0}
.msgs{flex:1;overflow-y:auto;padding:24px 28px}
.msg{display:flex;margin-bottom:18px;gap:10px}
.msg.mine{flex-direction:row-reverse}
.mav{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:#e9eaf2;color:#666;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.msg.mine .mav,.msg.ai .mav{background:linear-gradient(135deg,#8b7cff,#6352f5);color:#fff}
.body{max-width:66%}
.meta{font-size:11px;color:var(--muted);margin-bottom:5px}
.msg.mine .meta{text-align:right}
.bubble{padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.6;background:var(--card);
  border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.msg.mine .bubble{background:var(--primary);color:#fff;border-color:var(--primary)}
.msg.ai .bubble{background:var(--ai);border-color:#ddd6ff}
.del{border:none;background:transparent;color:#bbb;font-size:11px;cursor:pointer;margin-left:6px}
.del:hover{color:var(--danger)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 0}
/* 数据库视图 */
.dbwrap{padding:4px 0 20px}
.dbinfo{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.7}
.dbinfo b{color:var(--primary)}
.dbtab{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.dbtab th,.dbtab td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);word-break:break-all;vertical-align:top}
.dbtab th{background:#f7f7fc;color:var(--muted);font-weight:650;white-space:nowrap}
.dbtab tr:last-child td{border-bottom:none}
.dbtab .k{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:650;background:var(--soft);color:var(--primary)}
.dbtab .k.system{background:#fff6e0;color:#b8860b}
.dbtab .k.ai{background:#e6f7ef;color:#2a9d6a}
.dbtab .mono{font-family:Consolas,Monaco,monospace;font-size:11px;color:#5a5f75}
.composer{flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding:14px 28px 18px}
.tip{font-size:12px;color:var(--danger);min-height:16px;margin-bottom:4px}
.crow{display:flex;gap:12px;align-items:flex-end}
#input{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  font-size:14px;outline:none;max-height:120px;line-height:1.5;transition:.15s}
#input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft)}
.send{padding:12px 24px;border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:650;
  cursor:pointer;height:44px;background:linear-gradient(135deg,#7c6cff,#5a49f0);transition:.15s}
.send:hover{transform:translateY(-1px)}
.send:disabled{opacity:.5;cursor:not-allowed;transform:none}
.imgbtn{flex-shrink:0;height:44px;padding:0 16px;border:1px solid var(--border);border-radius:12px;background:#fff;
  color:var(--primary);font-size:14px;font-weight:650;cursor:pointer;transition:.15s;white-space:nowrap}
.imgbtn:hover{background:var(--soft);border-color:var(--primary)}
.imgbtn:disabled{opacity:.5;cursor:not-allowed}
/* 图片消息 */
.bubble.hasimg{padding:6px}
.bubble img{display:block;max-width:100%;max-height:320px;border-radius:9px;cursor:zoom-in}
.bubble .img-cap{padding:6px 8px 4px;white-space:pre-wrap;word-break:break-word}
/* 大图预览 */
.lightbox{position:fixed;inset:0;z-index:99;background:rgba(18,18,30,.86);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:14px;padding:24px;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:84vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45);cursor:default}
.lightbox .lbtip{color:#fff;font-size:13px;opacity:.8}

/* ===== 工具栏（图片 / 文件 / 语音） ===== */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.toolbar .imgbtn{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.imgbtn.on{background:var(--danger);border-color:var(--danger);color:#fff}
.rec-hint{font-size:12px;color:var(--danger);font-weight:650}
.rec-hint:before{content:"●";margin-right:5px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ===== 文件消息卡片 ===== */
.bubble.hasatt{padding:8px}
.file-card{display:flex;align-items:center;gap:11px;min-width:210px;max-width:300px;
  background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.msg.mine .file-card{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.file-ico{width:38px;height:38px;flex-shrink:0;border-radius:9px;background:var(--soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.msg.mine .file-ico{background:rgba(255,255,255,.25);color:#fff}
.file-meta{min-width:0;flex:1}
.file-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:11px;opacity:.72;margin-top:3px}
.file-dl{flex-shrink:0;border:none;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:650;cursor:pointer;
  background:var(--primary);color:#fff;text-decoration:none}
.file-dl:hover{filter:brightness(1.08)}
.msg.mine .file-dl{background:#fff;color:var(--primary)}

/* ===== 语音消息 ===== */
.voice-card{display:flex;align-items:center;gap:10px;min-width:190px}
.voice-play{width:38px;height:38px;flex-shrink:0;border:none;border-radius:50%;cursor:pointer;
  background:var(--soft);color:var(--primary);font-size:15px;display:flex;align-items:center;justify-content:center}
.msg.mine .voice-play{background:rgba(255,255,255,.25);color:#fff}
.voice-track{flex:1;min-width:70px}
.voice-bars{display:flex;align-items:center;gap:2px;height:20px}
.voice-bars i{display:block;width:3px;border-radius:2px;background:var(--primary);opacity:.75}
.msg.mine .voice-bars i{background:#fff}
.voice-time{font-size:11px;opacity:.75;margin-top:3px}

/* ===== 好友 / 私聊 视图 ===== */
.frwrap{max-width:640px;padding:4px 0 24px}
.fr-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.fr-tab{padding:9px 16px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--muted);
  font-size:13px;font-weight:650;cursor:pointer;transition:.15s}
.fr-tab:hover{border-color:var(--primary);color:var(--primary)}
.fr-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.fr-tab .cnt{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:11px;line-height:17px;text-align:center}
.fr-tab.active .cnt{background:#fff;color:var(--danger)}
.fr-search{display:flex;gap:8px;margin-bottom:16px}
.fr-search input{flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:#fbfbfe}
.fr-search input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--soft)}
.fr-search button{padding:0 18px;border:none;border-radius:10px;background:var(--primary);color:#fff;
  font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
.fr-sec{font-size:12px;color:var(--muted);font-weight:650;margin:18px 0 10px;letter-spacing:.4px}
.fr-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);
  border-radius:12px;margin-bottom:9px}
.fr-av{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#8b7cff,#6352f5);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.fr-info{flex:1;min-width:0}
.fr-nm{font-size:14px;font-weight:650}
.fr-id{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}
.fr-ops{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.fr-btn{padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);
  font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap}
.fr-btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.fr-btn.ok{background:#e6f7ef;border-color:#b7e6cf;color:#2a9d6a}
.fr-btn.no{border-color:#f3c9c9;color:var(--danger)}
.fr-btn:hover{filter:brightness(.98)}
.fr-empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 0}
.fr-note{font-size:12px;color:var(--muted);line-height:1.7;background:#f7f7fc;border:1px dashed var(--border);
  border-radius:10px;padding:12px 14px;margin-bottom:16px}
.pm-badge{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--primary);margin-left:8px;font-weight:650}

@media(max-width:720px){.side{width:64px;padding:12px 6px}.sec-label,.me>div:not(.avatar),.nav,.btn-quiet{font-size:0}
  .nav{text-align:center}.head,.msgs,.composer{padding-left:14px;padding-right:14px}.body{max-width:84%}
  .imgbtn{padding:0 11px;font-size:13px}.toolbar{gap:6px}.toolbar .imgbtn{padding:0 9px;font-size:12px}
  .fr-ops{flex-direction:column}}
/* ==================== 设计系统 v2：变量 / 层级 / 暗色主题 ==================== */
:root{
  --surface:#f7f8fc; --field:#fbfbfe; --hover:#f3f4fa; --av-bg:#e9eaf2;
  --border2:#d8dbe8; --glow1:#e9e5ff; --glow2:#dfefff;
  --shadow-xs:0 1px 3px rgba(31,35,51,.05);
  --shadow-sm:0 4px 14px rgba(31,35,51,.07);
  --shadow-md:0 12px 32px rgba(31,35,51,.10);
  --shadow-lg:0 24px 60px rgba(70,55,140,.15);
  --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --ease:cubic-bezier(.22,.61,.36,1); --dur:.22s;
}
html[data-theme="dark"]{
  --primary:#8b7cff; --primary2:#6d5efc; --soft:#2b2549; --bg:#11131c;
  --card:#1b1e2b; --text:#e9ebf5; --muted:#9299b2; --border:#2e3244; --border2:#3a3f55;
  --ai:#272340; --surface:#222634; --field:#202431; --hover:#282c3c; --av-bg:#2c3042;
  --glow1:#2a2350; --glow2:#152845;
  --shadow-xs:0 1px 3px rgba(0,0,0,.28);
  --shadow-sm:0 4px 14px rgba(0,0,0,.32);
  --shadow-md:0 12px 32px rgba(0,0,0,.40);
  --shadow-lg:0 24px 60px rgba(0,0,0,.52);
}
/* 暗色：把早期写死的浅色面统一换成主题变量 */
html[data-theme="dark"] .entry{background:radial-gradient(circle at 18% 12%,#241f45 0%,transparent 42%),radial-gradient(circle at 85% 88%,#152a48 0%,transparent 42%),var(--bg)}
html[data-theme="dark"] .nick-input,
html[data-theme="dark"] #input,
html[data-theme="dark"] .fr-search input{background:var(--field);color:var(--text);border-color:var(--border)}
html[data-theme="dark"] .me,
html[data-theme="dark"] .dbtab th,
html[data-theme="dark"] .fr-note{background:var(--surface)}
html[data-theme="dark"] .nav:hover{background:var(--hover)}
html[data-theme="dark"] .mav{background:var(--av-bg);color:var(--muted)}
html[data-theme="dark"] .imgbtn,
html[data-theme="dark"] .btn-quiet,
html[data-theme="dark"] .fr-tab,
html[data-theme="dark"] .fr-row,
html[data-theme="dark"] .fr-btn,
html[data-theme="dark"] .file-card{background:var(--card);color:var(--text);border-color:var(--border)}
html[data-theme="dark"] .dbtab,
html[data-theme="dark"] .bubble{background:var(--card);border-color:var(--border)}
html[data-theme="dark"] .dbtab th,html[data-theme="dark"] .dbtab td{border-color:var(--border)}
html[data-theme="dark"] .dbtab .mono,html[data-theme="dark"] .del,html[data-theme="dark"] .op-del{color:var(--muted)}
html[data-theme="dark"] .badge.local{background:#3a3016;color:#eac46c}
html[data-theme="dark"] .msg.mine .bubble{border-color:var(--primary2)}
html[data-theme="dark"] .fr-btn.pri,
html[data-theme="dark"] .fr-tab.active,
html[data-theme="dark"] .fr-search button,
html[data-theme="dark"] .file-dl{background:var(--primary2);border-color:var(--primary2);color:#fff}
html[data-theme="dark"] .lightbox{background:rgba(6,7,12,.92)}
html[data-theme="dark"] .img-cap,html[data-theme="dark"] .file-size{color:var(--text)}
/* 亮色下的质感增强 */
.card{border-radius:var(--r-xl);box-shadow:var(--shadow-lg)}
.head{box-shadow:var(--shadow-xs)}
.composer{box-shadow:0 -6px 26px rgba(31,35,51,.035)}
.bubble{box-shadow:var(--shadow-xs);border-radius:var(--r-md)}
.msg.mine .bubble{border-bottom-right-radius:5px}
.msg:not(.mine) .bubble{border-bottom-left-radius:5px}
.fr-row,.file-card,.dbtab{box-shadow:var(--shadow-xs)}
.fr-row{transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.fr-row:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.nav.active{box-shadow:inset 3px 0 0 var(--primary)}
/* 主题切换时的平滑过渡 */
body,.card,.side,.head,.composer,.bubble,.me,.nav,.dbtab,.fr-row,.fr-tab,.imgbtn,.btn-quiet,
.nick-input,#input,.badge,.theme-btn,.file-card,.fr-btn,.fr-search input,.dbtab th{
  transition:background-color .28s var(--ease),color .28s var(--ease),border-color .28s var(--ease),
             box-shadow .28s var(--ease),transform .28s var(--ease)}
/* ==================== 组件：图标 / 主题按钮 / 滚动条 / Toast / 确认框 ==================== */
.ic{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo .ic{width:27px;height:27px;stroke-width:1.6}
.logo.sm .ic{width:20px;height:20px;stroke-width:1.7}
.nav,.btn-quiet,.imgbtn{display:flex;align-items:center;gap:10px}
.nav .ic{width:17px;height:17px;opacity:.72;transition:opacity var(--dur)}
.nav.active .ic,.nav:hover .ic{opacity:1}
.btn-quiet .ic,.imgbtn .ic{width:16px;height:16px}
.imgbtn{justify-content:center}
.head-ops{display:flex;align-items:center;gap:10px}
.theme-btn{width:36px;height:36px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--muted);cursor:pointer}
.theme-btn:hover{color:var(--primary);border-color:var(--primary);transform:rotate(-18deg)}
.theme-btn .ic{width:17px;height:17px}
.theme-btn .ic-sun,.theme-btn.is-dark .ic-moon{display:none}
.theme-btn.is-dark .ic-sun{display:block}
#btnThemeEntry{position:absolute;top:20px;right:20px;z-index:2}
/* 自定义滚动条 */
.msgs::-webkit-scrollbar,.side::-webkit-scrollbar,.dbwrap::-webkit-scrollbar{width:9px;height:9px}
.msgs::-webkit-scrollbar-track,.side::-webkit-scrollbar-track{background:transparent}
.msgs::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb,.dbwrap::-webkit-scrollbar-thumb{
  background:var(--border2);border-radius:9px;border:2px solid var(--card)}
.msgs::-webkit-scrollbar-thumb:hover{background:var(--muted)}
/* 轻提示 */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:120;display:flex;flex-direction:column;gap:9px;
  pointer-events:none;max-width:min(360px,calc(100vw - 36px))}
.toast{padding:12px 16px;border-radius:var(--r-sm);background:var(--card);color:var(--text);
  border:1px solid var(--border);border-left:3px solid var(--primary);box-shadow:var(--shadow-md);
  font-size:13px;line-height:1.55;animation:toastIn .28s var(--ease) both}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
.toast.out{animation:toastOut .26s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(18px)}}
/* 确认框 */
.modal{position:fixed;inset:0;z-index:130;background:rgba(18,18,30,.48);display:flex;
  align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.modal-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:26px 24px 20px;box-shadow:var(--shadow-lg);text-align:center;
  animation:zoomIn .26s var(--ease)}
.modal-badge{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:var(--soft);color:var(--primary)}
.modal-badge .ic{width:23px;height:23px}
.modal-msg{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-line}
.modal-ops{display:flex;gap:10px;margin-top:22px}
.mbtn{flex:1;padding:11px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);
  color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:.18s}
.mbtn:hover{border-color:var(--primary);color:var(--primary)}
.mbtn.pri{background:var(--primary2);border-color:var(--primary2);color:#fff}
.mbtn.pri:hover{filter:brightness(1.08);color:#fff}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
/* ==================== 动效：入场 / 切换 / 涟漪 / 正在输入 ==================== */
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.msg.enter{animation:msgIn .34s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#msgs.swap{animation:viewIn .26s var(--ease)}
@keyframes sendPop{50%{transform:scale(1.07)}}
.send.sent{animation:sendPop .4s var(--ease)}
.btn,.send,.imgbtn,.fr-btn,.fr-tab,.mbtn,.theme-btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.38);transform:scale(0);
  animation:ripple .55s linear forwards;pointer-events:none}
.mbtn:not(.pri) .ripple,.fr-btn:not(.pri) .ripple,.fr-tab:not(.active) .ripple,
.imgbtn .ripple,.theme-btn .ripple{background:rgba(109,94,252,.18)}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
.lightbox.show{animation:fadeIn .2s ease}
.lightbox.show img{animation:zoomIn .26s var(--ease)}
@keyframes typing{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){
  .msg.enter,#msgs.swap,.lightbox.show,.lightbox.show img,.toast,.modal,.modal-card,.send.sent,
  .typing .bubble i,.sk-av,.sk-lines i{animation:none}
}
/* ==================== 气泡精修：小尾巴 / 头像配色 / 时间分组 / 连续合并 ==================== */
.bubble{position:relative}
.bubble:not(.hasimg):not(.hasatt)::after{content:"";position:absolute;bottom:0;left:-5px;width:11px;height:11px;
  background:inherit;clip-path:polygon(100% 0,100% 100%,0 100%)}
.msg.mine .bubble:not(.hasimg):not(.hasatt)::after{left:auto;right:-5px;clip-path:polygon(0 0,0 100%,100% 100%)}
.msg .mav.av-0{background:linear-gradient(135deg,#7c6cff,#5a49f0);color:#fff}
.msg .mav.av-1{background:linear-gradient(135deg,#ff9f7a,#f2664a);color:#fff}
.msg .mav.av-2{background:linear-gradient(135deg,#4fc3a1,#199e79);color:#fff}
.msg .mav.av-3{background:linear-gradient(135deg,#5aa9f5,#3b72d9);color:#fff}
.msg .mav.av-4{background:linear-gradient(135deg,#f4a7cf,#d9549b);color:#fff}
.msg .mav.av-5{background:linear-gradient(135deg,#f3c46b,#d99127);color:#fff}
.msg .mav.av-6{background:linear-gradient(135deg,#8fa0e8,#5c6bc0);color:#fff}
.msg .mav.av-7{background:linear-gradient(135deg,#6fcbd8,#2f98ab);color:#fff}
.msg .mav.av-sys{background:linear-gradient(135deg,#a2aac0,#737c95);color:#fff}
.day-sep{display:flex;align-items:center;gap:12px;margin:14px 0 18px;color:var(--muted);font-size:11px}
.day-sep:before,.day-sep:after{content:"";flex:1;height:1px;background:var(--border)}
.day-sep span{padding:3px 10px;border:1px solid var(--border);border-radius:20px;background:var(--surface)}
.msg.tight{margin-bottom:7px}
.msg.tight .mav{visibility:hidden}
.msg.tight .who{display:none}
.msg.tight .bubble{border-top-left-radius:6px}
.msg.mine.tight .bubble{border-top-left-radius:var(--r-md);border-top-right-radius:6px}
.meta{display:flex;align-items:center;gap:6px;min-height:16px}
.msg.mine .meta{justify-content:flex-end}
.mtime{opacity:.8}
.op-del{border:none;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;
  padding:1px 5px;border-radius:6px;opacity:.4;
  transition:opacity var(--dur),color var(--dur),background var(--dur)}
.msg:hover .op-del{opacity:1}
.op-del:hover{color:var(--danger);background:var(--surface)}
@media (hover:none){.op-del{opacity:.85}}
/* ==================== 空状态 / 骨架屏 / 正在输入 ==================== */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 0}
.empty-art{width:112px;height:84px}
.empty-txt{font-size:13px;color:var(--muted)}
.typing .bubble{display:flex;align-items:center;gap:5px;padding:14px 16px}
.typing .bubble i{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:typing 1.2s infinite}
.typing .bubble i:nth-child(2){animation-delay:.18s}
.typing .bubble i:nth-child(3){animation-delay:.36s}
.skeleton{padding:12px 0}
.sk-row{display:flex;gap:12px;margin-bottom:22px;align-items:flex-start}
.sk-row.right{flex-direction:row-reverse}
.sk-av{width:34px;height:34px;border-radius:50%;flex-shrink:0}
.sk-lines{flex:1;max-width:56%}
.sk-lines i{display:block;height:12px;border-radius:6px;margin-bottom:8px}
.sk-lines i:last-child{width:62%}
.sk-av,.sk-lines i{background:linear-gradient(90deg,var(--surface) 25%,var(--hover) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
/* ==================== 响应式：手机端用图标栏 + 抽屉式留白 ==================== */
@media(max-width:720px){
  .side{width:66px;padding:14px 8px}
  .side .sec-label,.side .me>div:not(.avatar),.side .nav span,
  .side .side-head>div:not(.logo),.btn-quiet span{display:none}
  .side .nav{justify-content:center;padding:12px 0;gap:0}
  .side .btn-quiet{justify-content:center}
  .side .me{justify-content:center;padding:8px}
  .head,.msgs,.composer{padding-left:14px;padding-right:14px}
  .body{max-width:84%}
  .frwrap{max-width:100%}
  .fr-ops{flex-direction:column}
  .entry{padding:14px}
  .card{padding:34px 24px 26px}
  #btnThemeEntry{top:14px;right:14px}
  .toast-wrap{top:12px;right:12px;left:12px;max-width:none}
  .head-ops{gap:6px}
  .badge{font-size:11px;padding:5px 9px}
  .dbtab{font-size:11px}
  .dbtab th,.dbtab td{padding:8px 7px}
  .bubble-pop{width:min(248px,calc(100vw - 28px))}
}
/* ==================== 数据库视图：多表切换 ==================== */
.db-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.db-tab{padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);
  color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;transition:.15s}
.db-tab:hover{border-color:var(--primary);color:var(--primary)}
.db-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.db-note{font-size:12px;line-height:1.8;color:var(--muted);background:var(--surface);
  border:1px dashed var(--border2);border-radius:10px;padding:11px 14px;margin:0 0 14px}
.db-note b{color:var(--primary)}
.db-note code{font-family:Consolas,Monaco,monospace;font-size:11px;background:var(--card);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.db-mask{font-family:Consolas,Monaco,monospace;font-size:11px;color:var(--muted)}
.db-tag{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:650;
  background:var(--soft);color:var(--primary)}
.db-tag.ok{background:#e6f7ef;color:#2a9d6a}
/* ==================== 气泡样式选择面板 ==================== */
.bubble-wrap{position:relative}
.bubble-pop{position:absolute;top:46px;right:0;width:252px;z-index:60;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-md);
  padding:12px;animation:zoomIn .2s var(--ease)}
.bp-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;
  color:var(--text);padding:2px 4px 10px}
.bp-head span{font-size:11px;font-weight:600;color:var(--primary)}
.bp-list{display:flex;flex-direction:column;gap:3px}
.bp-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:1px solid transparent;
  border-radius:10px;background:transparent;cursor:pointer;text-align:left;transition:.15s}
.bp-item:hover{background:var(--hover)}
.bp-item.on{background:var(--soft);border-color:var(--border2)}
.bp-preview{flex-shrink:0;width:52px;height:34px;position:relative;background:var(--surface);
  border-radius:7px;overflow:hidden}
.bp-preview i,.bp-preview b{position:absolute;display:block;height:10px;border-radius:6px}
.bp-preview i{left:5px;top:5px;width:26px;background:#dcdfea;border:1px solid #c9cddd}
.bp-preview b{right:5px;top:18px;width:28px;background:var(--primary)}
.bp-classic i{border-bottom-left-radius:2px}
.bp-classic b{border-bottom-right-radius:2px}
.bp-flat i,.bp-flat b{border-radius:3px;box-shadow:none}
.bp-flat i{border-left:3px solid var(--primary)}
.bp-flat b{border-right:3px solid var(--primary2)}
.bp-glass{background:linear-gradient(135deg,#e9e5ff,#dff6ff)}
.bp-glass i{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.95)}
.bp-glass b{background:linear-gradient(135deg,rgba(124,108,255,.88),rgba(90,73,240,.88));
  border:1px solid rgba(255,255,255,.45);border-radius:9px}
.bp-neon{background:#f7f4ff}
.bp-neon i{background:#fff;border-color:#e3d9ff;border-radius:9px}
.bp-neon b{background:linear-gradient(135deg,#7c6cff,#ff79b8);border-radius:9px;
  box-shadow:0 2px 7px rgba(124,108,255,.45)}
.bp-note{background:repeating-linear-gradient(0deg,#fffdf3,#fffdf3 9px,#f4eedb 10px)}
.bp-note i{background:#fffdf3;border-color:#ece2c2;border-radius:2px 7px 7px 7px}
.bp-note b{background:#fff3d6;border:1px solid #e9d6a2;border-radius:7px 2px 7px 7px}
.bp-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.bp-name{font-size:13px;font-weight:650;color:var(--text);white-space:nowrap}
.bp-desc{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-check{margin-left:auto;width:16px;height:16px;flex-shrink:0;color:var(--primary);opacity:0}
.bp-item.on .bp-check{opacity:1}
.bp-foot{font-size:10px;color:var(--muted);line-height:1.7;padding:10px 4px 2px;
  margin-top:8px;border-top:1px solid var(--border)}
/* ==================== 气泡皮肤：5 套可切换（classic=默认，无需覆盖） ==================== */
/* 非经典样式统一收起小尾巴，保持造型干净 */
html[data-bubble="flat"] .bubble:not(.hasimg):not(.hasatt)::after,
html[data-bubble="glass"] .bubble:not(.hasimg):not(.hasatt)::after,
html[data-bubble="neon"] .bubble:not(.hasimg):not(.hasatt)::after,
html[data-bubble="note"] .bubble:not(.hasimg):not(.hasatt)::after{display:none}
/* ② 简约扁平：直角、细边、无阴影、左右色条 */
html[data-bubble="flat"] .msg .bubble{border-radius:8px;box-shadow:none;background:var(--card);
  color:var(--text);border:1px solid var(--border2);border-left:3px solid var(--primary)}
html[data-bubble="flat"] .msg.mine .bubble{background:var(--primary);color:#fff;
  border:1px solid var(--primary);border-right:3px solid var(--primary2)}
html[data-bubble="flat"] .msg.ai .bubble{border-left-color:var(--ok)}
/* ③ 玻璃拟态：半透明磨砂 + 背景光晕 */
html[data-bubble="glass"] .msgs{
  background:radial-gradient(circle at 12% 18%,rgba(124,108,255,.20) 0,transparent 38%),
             radial-gradient(circle at 88% 70%,rgba(80,190,220,.18) 0,transparent 40%),
             radial-gradient(circle at 58% 96%,rgba(255,140,200,.14) 0,transparent 35%),var(--bg)}
html[data-bubble="glass"] .msg .bubble{background:rgba(255,255,255,.62);color:var(--text);
  border:1px solid rgba(255,255,255,.78);border-radius:20px;
  box-shadow:0 8px 28px rgba(31,35,51,.10),inset 0 1px 0 rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4)}
html[data-bubble="glass"] .msg.mine .bubble{
  background:linear-gradient(135deg,rgba(124,108,255,.9),rgba(90,73,240,.9));
  color:#fff;border-color:rgba(255,255,255,.38)}
html[data-bubble="glass"] .msg.ai .bubble{background:rgba(238,232,255,.72)}
html[data-theme="dark"][data-bubble="glass"] .msgs{
  background:radial-gradient(circle at 12% 18%,rgba(124,108,255,.22) 0,transparent 38%),
             radial-gradient(circle at 88% 70%,rgba(60,160,200,.16) 0,transparent 40%),var(--bg)}
html[data-theme="dark"][data-bubble="glass"] .msg .bubble{background:rgba(38,42,60,.66);
  color:var(--text);border-color:rgba(255,255,255,.14)}
html[data-theme="dark"][data-bubble="glass"] .msg.ai .bubble{background:rgba(70,58,120,.58)}
/* ④ 渐变霓虹：紫粉渐变 + 柔光 */
html[data-bubble="neon"] .msg .bubble{background:linear-gradient(135deg,#fff,#f4f0ff);
  color:var(--text);border:1px solid #e3d9ff;border-radius:18px;
  box-shadow:0 6px 18px rgba(109,94,252,.12)}
html[data-bubble="neon"] .msg.mine .bubble{
  background:linear-gradient(135deg,#7c6cff 0%,#a35cff 52%,#ff79b8 100%);
  color:#fff;border:none;border-radius:18px;
  box-shadow:0 8px 24px rgba(124,108,255,.38),inset 0 0 0 1px rgba(255,255,255,.18)}
html[data-bubble="neon"] .msg.ai .bubble{background:linear-gradient(135deg,#fff,#e9fbff);border-color:#cdeef5}
html[data-theme="dark"][data-bubble="neon"] .msg .bubble{
  background:linear-gradient(135deg,#242838,#2c2746);color:var(--text);border-color:#3a3458}
html[data-theme="dark"][data-bubble="neon"] .msg.ai .bubble{
  background:linear-gradient(135deg,#202a38,#243c48);border-color:#33536a}
/* ⑤ 手账便签：纸张底纹 + 折角 + 深色文字（附件卡片同步换成纸色） */
html[data-bubble="note"] .msgs{
  background:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,.022) 28px),var(--bg)}
html[data-bubble="note"] .msg .bubble{background:#fffdf3;color:#3a3527;
  border:1px solid #ece2c2;border-radius:3px 16px 16px 16px;
  box-shadow:2px 3px 0 rgba(180,160,100,.16);
  font-family:"Kaiti SC","STKaiti","KaiTi","Segoe UI","Microsoft YaHei",sans-serif}
html[data-bubble="note"] .msg.mine .bubble{background:#fff3d6;color:#43391f;
  border-color:#e9d6a2;border-radius:16px 3px 16px 16px}
html[data-bubble="note"] .msg.ai .bubble{background:#f0f8ee;border-color:#d5e8cf}
html[data-bubble="note"] .msg.mine .file-card{background:#fffdf3;border-color:#e9d6a2;color:#43391f}
html[data-bubble="note"] .msg.mine .file-ico{background:#f3e7c6;color:#8a6d28}
html[data-bubble="note"] .msg.mine .file-dl{background:#8a6d28;color:#fff}
html[data-bubble="note"] .msg.mine .voice-play{background:#f3e7c6;color:#8a6d28}
html[data-bubble="note"] .msg.mine .voice-bars i{background:#8a6d28}
html[data-bubble="note"] .msg.mine .bubble .img-cap{color:#43391f}
html[data-theme="dark"][data-bubble="note"] .msg .bubble{background:#2b2a22;color:#eee6cf;
  border-color:#4a4530;box-shadow:2px 3px 0 rgba(0,0,0,.3)}
html[data-theme="dark"][data-bubble="note"] .msg.mine .bubble{background:#3a3320;color:#f5ead0;border-color:#6b5c33}
html[data-theme="dark"][data-bubble="note"] .msg.ai .bubble{background:#25302a;border-color:#3f5647}
html[data-theme="dark"][data-bubble="note"] .msg.mine .file-card{background:#2b2a22;
  border-color:#6b5c33;color:#f5ead0}
/* 暗色通用规则与皮肤规则的优先级相同且写在后面，会误伤「自己发的」气泡；
   这里用更高优先级把每套皮肤的主色补回来（亮/暗两套主题都保持同一风格识别度） */
html[data-theme="dark"][data-bubble="flat"] .msg.mine .bubble{
  background:var(--primary);color:#fff;border:1px solid var(--primary);border-right:3px solid var(--primary2)}
html[data-theme="dark"][data-bubble="glass"] .msg.mine .bubble{
  background:linear-gradient(135deg,rgba(124,108,255,.9),rgba(90,73,240,.9));
  color:#fff;border-color:rgba(255,255,255,.28)}
html[data-theme="dark"][data-bubble="neon"] .msg.mine .bubble{
  background:linear-gradient(135deg,#7c6cff 0%,#a35cff 52%,#ff79b8 100%);color:#fff;border:none;
  box-shadow:0 8px 24px rgba(124,108,255,.38),inset 0 0 0 1px rgba(255,255,255,.18)}
html[data-theme="dark"][data-bubble="note"] .msg.mine .bubble{
  background:#3a3320;color:#f5ead0;border-color:#6b5c33}
/* ==================== 萌系装扮气泡（照着装扮商城做的卡通造型气泡） ====================
   用 html[data-bubble^="cute-"] 统一命中，颜色由每套皮肤自己定义 CSS 变量；
   猫耳 / 兔耳 / 蝴蝶结 / 尾巴 / 翅膀 / 邮票 / 底座由 render() 注入的 .bd 装饰元素绘制。 */
html[data-bubble="cute-cat"]{--bub-other:#fff8fb;--bub-mine:#ffe9f3;--bub-frame:#ffc9de;--bub-text:#5b4652}
html[data-bubble="cute-bunny"]{--bub-other:#fff7fb;--bub-mine:#ffe6f2;--bub-frame:#f7b6d3;--bub-text:#5b3f51}
html[data-bubble="cute-chick"]{--bub-other:#fffbe6;--bub-mine:#fff2b8;--bub-frame:#f2cf62;--bub-text:#5c4a22}
html[data-bubble="cute-duck"]{--bub-other:#fffdf3;--bub-mine:#fff6df;--bub-frame:#f2d9a0;--bub-text:#6b4f24}
html[data-bubble="cute-envelope"]{--bub-other:#fffafa;--bub-mine:#fff0f0;--bub-frame:#eaa0a0;--bub-text:#5c3b3b}
html[data-bubble="cute-monitor"]{--bub-other:#f7f8ff;--bub-mine:#e9ecff;--bub-frame:#8b95b8;--bub-text:#333c5c}
html[data-bubble="cute-angel"]{--bub-other:#f4fbff;--bub-mine:#e4f3ff;--bub-frame:#a9d3ec;--bub-text:#33556b}
html[data-bubble="cute-ribbon"]{--bub-other:#fff7fb;--bub-mine:#ffe4f0;--bub-frame:#f4b6cf;--bub-text:#5c3f51}
html[data-theme="dark"][data-bubble^="cute-"]{--bub-other:#262936;--bub-mine:#332f45;--bub-frame:#5a5573;--bub-text:#ecebf5}
/* 萌系装扮给聊天区加一层很淡的柔光，呼应参考图里那种梦幻背景 */
html[data-bubble^="cute-"] .msgs{
  background:radial-gradient(circle at 15% 25%,rgba(255,190,220,.16) 0,transparent 23%),
             radial-gradient(circle at 82% 66%,rgba(170,215,245,.14) 0,transparent 25%),
             radial-gradient(circle at 55% 92%,rgba(255,225,160,.13) 0,transparent 21%),var(--bg)}
html[data-bubble^="cute-"] .msg .bubble{background:var(--bub-other);color:var(--bub-text);
  border:2px solid var(--bub-frame);border-radius:20px;padding:12px 16px;
  box-shadow:0 4px 14px rgba(31,35,51,.07)}

html[data-bubble="cute-monitor"] .msg .bubble{border-radius:10px;box-shadow:inset 0 0 0 2px rgba(139,149,184,.18)}
/* ==================== 装扮面板：改成商城式缩略图网格 ==================== */
.bubble-pop{width:min(452px,calc(100vw - 28px));padding:14px}
.bp-head{font-size:13px;padding:2px 4px 12px}
.bp-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.bp-sec{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;
  padding:8px 4px 3px;border-bottom:1px dashed var(--border);margin-top:2px}
.bp-item{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;
  padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:11px}
.bp-item:hover{border-color:var(--primary);background:var(--hover)}
.bp-item.on{background:var(--soft);border-color:var(--primary)}
.bp-preview{width:100%;height:40px;border-radius:8px}
.bp-text{gap:1px}
.bp-name{font-size:12px}
.bp-desc{font-size:10px;white-space:nowrap}
.bp-check{position:absolute;top:6px;right:6px;margin-left:0;opacity:0;
  background:var(--primary);color:#fff;border-radius:50%;padding:2px;width:17px;height:17px}
.bp-item.on .bp-check{opacity:1}
/* 萌系缩略图：统一猫耳造型 + 每套自己的描边色 */
.bp-preview.bp-cute{background:var(--card)}
.bp-preview.bp-cute i,.bp-preview.bp-cute b{background:#fff;border:2px solid var(--bp-frame,#ffc9de);border-radius:10px}
.bp-preview.bp-cute:before,.bp-preview.bp-cute:after{content:"";position:absolute;top:5px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:10px solid var(--bp-frame,#ffc9de);z-index:2}
.bp-preview.bp-cute:before{left:8px}
.bp-preview.bp-cute:after{left:24px}
/* 水豚噜噜缩略图：橘子 + 格子胶带 + 小水豚，和其他萌系缩略图区分开 */
.bp-preview.bp-capy{background:#fffdf3;overflow:visible}
.bp-preview.bp-capy i,.bp-preview.bp-capy b{background:#fffdf3;border-color:#f2d9a0}
.bp-preview.bp-capy:before{left:6px;top:5px;width:8px;height:8px;border-radius:50%;
  border:1px solid #e99a1c;border-bottom:7px solid transparent;
  background:radial-gradient(circle at 32% 28%,#ffdd78 0,#ffb02e 60%,#ef8c12 100%);z-index:3}
.bp-preview.bp-capy:after{right:5px;top:3px;width:10px;height:6px;border:1px solid #e2c367;
  border-radius:2px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.6) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 1px,transparent 1px 3px),#f7d97a;
  transform:rotate(14deg);z-index:3}
.bp-mini-capy{position:absolute;right:0;bottom:-5px;width:18px;height:18px;z-index:4;text-decoration:none}
.bp-mini-capy img{width:100%;height:100%;display:block;object-fit:contain}

/* ==================== 表情包面板 / 表情消息 ==================== */
.sticker-wrap{position:relative;display:inline-flex}
.sticker-pop{position:absolute;bottom:calc(100% + 12px);left:0;width:318px;
  max-width:calc(100vw - 28px);z-index:70;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:12px;animation:zoomIn .2s var(--ease)}
.sp-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;
  font-weight:700;color:var(--text);margin-bottom:10px}
.sp-x{width:24px;height:24px;border:none;border-radius:6px;background:var(--surface);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sp-x .ic{width:14px;height:14px}
.sp-x:hover{color:var(--danger)}
.sp-tabs{display:flex;gap:6px;margin-bottom:10px}
.sp-tab{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  color:var(--muted);font-size:12px;font-weight:650;cursor:pointer}
.sp-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.sp-body{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:180px;overflow-y:auto}
.sp-body.pack{grid-template-columns:repeat(4,1fr);gap:7px;max-height:210px}
.sp-emoji{border:none;background:transparent;font-size:21px;line-height:1.3;padding:4px 0;
  border-radius:7px;cursor:pointer;transition:.12s}
.sp-emoji:hover{background:var(--hover);transform:scale(1.18)}
.sp-sticker{border:1px solid var(--border);border-radius:11px;background:var(--surface);padding:5px 3px;
  cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.sp-sticker:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.sp-sticker svg{width:100%;height:56px}

/* ==================== 悬浮智能体「小星」 ==================== */
.ai-pet{position:absolute;right:22px;bottom:132px;z-index:45;width:118px;
  display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;touch-action:none;
  filter:drop-shadow(0 8px 16px rgba(31,35,51,.16))}
.ai-pet:active{cursor:grabbing}
.ai-pet:before{content:"";position:absolute;top:6px;left:8px;right:8px;height:112px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,226,155,.42) 0,transparent 70%);
  filter:blur(7px);z-index:-1;pointer-events:none}
.pet-art{width:110px;height:138px;animation:petFloat 3.2s ease-in-out infinite;position:relative}
.pet-img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.pet-glint{position:absolute;right:-4px;top:-2px;font-size:16px;color:#ffd45e;opacity:0;transition:opacity .25s;text-shadow:0 0 8px #ffcf5e}
.pet-x{position:absolute;top:-6px;right:-2px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:3;opacity:0;transition:.15s}
.pet-x .ic{width:12px;height:12px}
.ai-pet:hover .pet-x{opacity:1}
.pet-say{position:absolute;right:96%;top:8px;width:168px;padding:9px 11px;
  border-radius:12px 12px 4px 12px;background:var(--card);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);font-size:12px;line-height:1.6;color:var(--text);z-index:4}
.pet-say.show{animation:zoomIn .22s var(--ease)}
.pet-tag{margin-top:-6px;padding:4px 12px;border-radius:14px;background:var(--card);
  border:1px solid var(--border);box-shadow:var(--shadow-xs);font-size:11px;
  font-weight:700;color:var(--primary);white-space:nowrap}
.pet-ask{margin-top:6px;border:none;border-radius:14px;padding:5px 12px;
  background:linear-gradient(135deg,#7c6cff,#5a49f0);color:#fff;font-size:11px;
  font-weight:650;cursor:pointer;box-shadow:0 5px 14px rgba(109,94,252,.35)}
.pet-restore{position:absolute;right:18px;bottom:18px;z-index:45;border:none;border-radius:18px;
  padding:8px 14px;background:linear-gradient(135deg,#7c6cff,#5a49f0);color:#fff;
  font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(109,94,252,.4)}
@keyframes petFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes wingFlap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
/* 3D 女孩小星：原图形象不变，用 8 组整体动作 + 粒子特效表现不同状态 */
.pet-fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.pet-fx .fx{position:absolute;display:block;font-weight:900;line-height:1;pointer-events:none;will-change:transform,opacity}
.fx-star{color:#ffd35c;text-shadow:0 0 8px rgba(255,196,60,.75);font-size:14px}
.fx-heart{color:#ff7fa8;text-shadow:0 0 8px rgba(255,110,160,.55);font-size:16px}
.fx-q{color:#8a7cff;font-size:20px;text-shadow:0 0 8px rgba(124,108,255,.5)}
.fx-bulb{color:#ffc94d;font-size:18px;text-shadow:0 0 10px rgba(255,201,77,.7)}
.fx-z{color:#9fb3d1;font-size:14px}
.fx-bang{color:#ff6b8a;font-size:18px}
.fx-conf{width:7px;height:10px;border-radius:2px}
.ai-pet[data-pose="wave"] .fx-star{font-size:19px;color:#ffd45e;text-shadow:0 0 12px rgba(255,190,40,.9),0 0 4px #fff8d8}
.ai-pet[data-pose="heart"] .pet-art{animation:petHeart 2.4s ease-in-out infinite}
.ai-pet[data-pose="wave"] .pet-art{animation:petWaveHello 1.2s ease-in-out infinite}
.ai-pet[data-pose="think"] .pet-art{animation:petThink 2.3s ease-in-out infinite}
.ai-pet[data-pose="happy"] .pet-art{animation:petHappy .95s ease-in-out infinite}
.ai-pet[data-pose="shy"] .pet-art{animation:petShy 1.7s ease-in-out infinite}
.ai-pet[data-pose="teach"] .pet-art{animation:petTeach 2.4s ease-in-out infinite}
.ai-pet[data-pose="sleep"] .pet-art{animation:petSleep 3.4s ease-in-out infinite}
.ai-pet[data-pose="surprise"] .pet-art{animation:petSurprise 1.6s ease-in-out infinite}
.ai-pet[data-pose="happy"] .pet-glint,.ai-pet[data-pose="teach"] .pet-glint,
.ai-pet[data-pose="surprise"] .pet-glint{opacity:1}
.ai-pet[data-pose="heart"] .fx{animation:fxFloatUp 2s ease-out infinite}
.ai-pet[data-pose="wave"] .fx{animation:fxOrbit 1.5s ease-in-out infinite}
.ai-pet[data-pose="think"] .fx{animation:fxPop 2.2s ease-in-out infinite}
.ai-pet[data-pose="happy"] .fx{animation:fxConfetti 1.6s linear infinite}
.ai-pet[data-pose="shy"] .fx{animation:fxFloatUp 2.4s ease-out infinite}
.ai-pet[data-pose="teach"] .fx{animation:fxPop 2.2s ease-in-out infinite}
.ai-pet[data-pose="sleep"] .fx{animation:fxZzz 3s ease-out infinite}
.ai-pet[data-pose="surprise"] .fx{animation:fxPop 1.4s ease-out infinite}
@keyframes petHeart{0%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(-2px) scale(1.035)}40%{transform:translateY(0) scale(1)}60%{transform:translateY(-2px) scale(1.025)}}
@keyframes petWaveHello{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-9deg) translateY(-4px)}50%{transform:rotate(0) translateY(-2px)}75%{transform:rotate(9deg) translateY(-4px)}}
@keyframes petThink{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-5px)}}
@keyframes petHappy{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-15px) scale(1.06)}70%{transform:translateY(0) scale(.98)}}
@keyframes petShy{0%,100%{transform:rotate(5deg) scale(.96)}50%{transform:rotate(1deg) scale(.98)}}
@keyframes petTeach{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes petSleep{0%,100%{transform:translateY(0) scale(.985)}50%{transform:translateY(-3px) scale(1)}}
@keyframes petSurprise{0%,100%{transform:scale(1)}25%{transform:scale(1.08) translateY(-5px)}55%{transform:scale(.98)}}
@keyframes fxFloatUp{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1.1)}}
@keyframes fxOrbit{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0)}25%{opacity:1;transform:translate(10px,-10px) scale(1.25) rotate(45deg)}65%{opacity:1;transform:translate(18px,-26px) scale(1.05) rotate(110deg)}100%{opacity:0;transform:translate(22px,-34px) scale(.55) rotate(160deg)}}
@keyframes fxPop{0%,100%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.15)}70%{opacity:.9;transform:scale(1)}}
@keyframes fxConfetti{0%{opacity:0;transform:translateY(6px) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px) rotate(220deg)}}
@keyframes fxZzz{0%{opacity:0;transform:translate(0,6px) scale(.7)}30%{opacity:.95}100%{opacity:0;transform:translate(12px,-30px) scale(1.1)}}

  collection: 'chat_messages',

};
/* 主题引导：在页面绘制前定好亮/暗，避免刷新时闪一下白屏 */
(function(){
  var t=null;
  try{ t=window.localStorage.getItem('spark_chat_theme_v1'); }catch(e){}
  if(t!=='dark' && t!=='light'){
    t=(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  // 气泡样式同样在绘制前定好，避免刷新时先闪一下默认样式
  try{
    var b=window.localStorage.getItem('spark_chat_bubble_v1');

})();

/* ==================================================================
   星火聊天室 · 单文件版
   模块顺序：配置(上) → 数据层 STORE → 限流 RATE → 助手 AI → 界面 UI
   两人分工：前端同学改【样式 + UI】，后端同学改【STORE + RATE + AI + 配置】
   ================================================================== */
(function(){
'use strict';
var CFG = window.CHAT_CONFIG;
var $ = function(id){ return document.getElementById(id); };

/* ===== 工具 ===== */
function uid(){ return 'u_' + Math.random().toString(36).slice(2,10); }
function idFromName(name){ var h=0; for(var i=0;i<name.length;i++){h=((h<<5)-h+name.charCodeAt(i))|0;} return 'u_'+Math.abs(h).toString(36); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function nowISO(){ return new Date().toISOString(); }
function hhmm(iso){ try{ var d=new Date(iso); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }catch(e){ return ''; } }

/* 图片工具 IMG：读取文件 → canvas 压缩 → dataURL。只产出 data:image/ 前缀，供渲染层安全校验 */
var IMG = {
  MAX_SIDE: 1280,   // 压缩后最长边
  QUALITY: 0.78,    // JPEG 质量
  // file -> Promise<{dataURL,w,h,bytes}>；自动按比例缩放、白底合成避免透明 PNG 变黑
  read:function(file){
    return new Promise(function(resolve,reject){
      if(!file || !/^image\//i.test(file.type)){ reject(new Error('请选择图片文件（JPG/PNG/GIF/WebP）')); return; }
      var fr=new FileReader();
      fr.onerror=function(){ reject(new Error('读取图片失败')); };
      fr.onload=function(){
        var im=new Image();
        im.onerror=function(){ reject(new Error('图片解析失败，换一张试试')); };
        im.onload=function(){
          try{
            var w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
            if(!w||!h) throw new Error('图片尺寸异常');
            var scale=Math.min(1, IMG.MAX_SIDE/Math.max(w,h));
            var cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
            var cv=document.createElement('canvas');
            cv.width=cw; cv.height=ch;
            var ctx=cv.getContext('2d');
            ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cw,ch);
            ctx.drawImage(im,0,0,cw,ch);
            var data=cv.toDataURL('image/jpeg', IMG.QUALITY);
            if(data.indexOf('data:image/')!==0) throw new Error('图片压缩失败');
            resolve({ dataURL:data, w:cw, h:ch, bytes:Math.round(data.length*0.75) });
          }catch(e){ reject(e); }
        };
        im.src=fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
};

/* 附件工具 FILE：任意文件 → base64 dataURL（带体积保护）。
   只保存文件名/大小/类型/数据，不做任何执行，下载时用 <a download> 交给浏览器。 */
var FILE = {
  LIMIT: function(){ return (CFG.maxFileBytes||512*1024); },
  read:function(file){
    return new Promise(function(resolve,reject){
      if(!file){ reject(new Error('未选择文件')); return; }
      if(file.size > FILE.LIMIT()){ reject(new Error('文件超过 '+Math.round(FILE.LIMIT()/1024)+'KB 上限，请换小一点的文件')); return; }
      // 本地/临时存储容量有限，进一步限制，避免把整批消息写爆
      if(Store.mode!=='cloud' && SafeLS.level()<2 && file.size > 180*1024){
        reject(new Error('当前浏览器存储受限，请上传 180KB 以内的文件（或填 env 用云端）')); return;
      }
      var fr=new FileReader();
      fr.onerror=function(){ reject(new Error('读取文件失败')); };
      fr.onload=function(){
        var d=String(fr.result||'');
        if(d.indexOf('data:')!==0){ reject(new Error('文件编码失败')); return; }
        resolve({ name:file.name||'未命名文件', size:file.size||0, type:file.type||'', data:d });
      };
      fr.readAsDataURL(file);
    });
  },
  ext:function(name){
    var m=String(name||'').match(/\.([a-z0-9]{1,5})$/i);
    return m?m[1].toUpperCase():'文件';
  },
  kb:function(n){ n=n||0; return n>=1024*1024 ? (n/1024/1024).toFixed(1)+'MB' : Math.max(1,Math.round(n/1024))+'KB'; }
};

/* 语音工具 VOICE：MediaRecorder 录音 → base64 dataURL + 时长。
   预览面板 / 无麦克风权限时会失败，上层降级为「上传音频文件」。 */
var VOICE = {
  rec:null, stream:null, chunks:[], t0:0, timer:null, active:false,
  supported:function(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  start:function(){
    var self=this;
    if(!this.supported()) return Promise.reject(new Error('当前环境不支持录音'));
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      self.stream=stream; self.chunks=[];
      var opts = window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? {mimeType:'audio/webm;codecs=opus'} : {};
      try{ self.rec=new MediaRecorder(stream,opts); }catch(e){ self.rec=new MediaRecorder(stream); }
      self.rec.ondataavailable=function(e){ if(e.data && e.data.size) self.chunks.push(e.data); };
      self.rec.start(); self.t0=Date.now(); self.active=true;
      return true;
    });
  },
  stop:function(){
    var self=this;
    if(!this.rec || !this.active) return Promise.reject(new Error('没有正在进行的录音'));
    return new Promise(function(resolve,reject){
      self.rec.onstop=function(){
        var dur=Math.max(1,Math.round((Date.now()-self.t0)/1000));
        var blob=new Blob(self.chunks,{type:self.rec.mimeType||'audio/webm'});
        var mime=blob.type||'audio/webm';
        var fr=new FileReader();
        fr.onerror=function(){ reject(new Error('音频编码失败')); };
        fr.onload=function(){ resolve({ data:String(fr.result||''), dur:dur, mime:mime, bytes:blob.size }); };
        fr.readAsDataURL(blob);
        self.cleanup();
      };
      try{ self.rec.stop(); }catch(e){ self.cleanup(); reject(e); }
    });
  },
  cancel:function(){ try{ if(this.rec && this.active) this.rec.stop(); }catch(e){} this.cleanup(); },
  cleanup:function(){
    this.active=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.stream){ try{ this.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    this.stream=null; this.rec=null; this.chunks=[];
  }
};

/* 安全存储：localStorage → sessionStorage → Cookie → window.name → 内存 依次降级。
   预览面板常禁用 localStorage，window.name 在同一标签页刷新后仍保留，尽量让账号/消息刷新不丢。 */
var SafeLS = (function(){
  var bag = {}, backend = 'memory', active = null;
  var P = 'spark_chat_'; // 本程序占用的键前缀，保存时先清掉旧键再写入，保证删除同步生效
  var C = [
    { name:'local', level:2,
      available:function(){ var s=window.localStorage; if(!s) return false; try{ s.setItem('__sp','1'); s.removeItem('__sp'); return true; }catch(e){ return false; } },
      load:function(){ var s=window.localStorage, m={}; for(var i=0;i<s.length;i++){ var k=s.key(i); if(k.indexOf(P)===0) m[k]=s.getItem(k); } return m; },
      save:function(m){ var s=window.localStorage, d=[]; for(var i=0;i<s.length;i++){ var k=s.key(i); if(k.indexOf(P)===0) d.push(k); } d.forEach(function(k){ s.removeItem(k); }); Object.keys(m).forEach(function(k){ s.setItem(k,m[k]); }); } },
    { name:'session', level:2,
      available:function(){ var s=window.sessionStorage; if(!s) return false; try{ s.setItem('__sp','1'); s.removeItem('__sp'); return true; }catch(e){ return false; } },
      load:function(){ var s=window.sessionStorage, m={}; for(var i=0;i<s.length;i++){ var k=s.key(i); if(k.indexOf(P)===0) m[k]=s.getItem(k); } return m; },
      save:function(m){ var s=window.sessionStorage, d=[]; for(var i=0;i<s.length;i++){ var k=s.key(i); if(k.indexOf(P)===0) d.push(k); } d.forEach(function(k){ s.removeItem(k); }); Object.keys(m).forEach(function(k){ s.setItem(k,m[k]); }); } },
    { name:'cookie', level:2,
      available:function(){ try{ document.cookie='__sp=1; path=/'; var ok=document.cookie.indexOf('__sp=1')>=0; document.cookie='__sp=; path=/; max-age=0'; return ok; }catch(e){ return false; } },
      load:function(){ var m={}; (document.cookie||'').split(';').forEach(function(c){ var p=c.indexOf('='); if(p<0) return; var k=decodeURIComponent(c.slice(0,p).trim()); if(k.indexOf('sp_')===0) m[k.slice(3)]=decodeURIComponent(c.slice(p+1)); }); return m; },
      save:function(m){ (document.cookie||'').split(';').forEach(function(c){ var p=c.indexOf('='); if(p<0) return; var k=decodeURIComponent(c.slice(0,p).trim()); if(k.indexOf('sp_')===0) document.cookie=k+'=; path=/; max-age=0'; }); Object.keys(m).forEach(function(k){ document.cookie='sp_'+encodeURIComponent(k)+'='+encodeURIComponent(m[k])+'; path=/; max-age=31536000'; }); } },
    { name:'name', level:1,
      available:function(){ return true; },
      load:function(){ try{ return JSON.parse(window.name||'{}')||{}; }catch(e){ return {}; } },
      save:function(m){ window.name=JSON.stringify(m); } }
  ];
  for(var i=0;i<C.length;i++){
    if(C[i].available && !C[i].available()) continue;
    try{ bag=C[i].load(); active=C[i]; backend=C[i].name; break; }catch(e){}
  }
  function persist(){ if(!active) return; try{ active.save(bag); }catch(e){ active=null; backend='memory'; } }
  return {
    backend:function(){ return backend; },
    level:function(){ return active?active.level:0; },
    getItem:function(k){ return (k in bag)?bag[k]:null; },
    setItem:function(k,v){ bag[k]=String(v); persist(); },
    removeItem:function(k){ delete bag[k]; persist(); }
  };
})();

/* ===== 账号 AUTH：本地账号表 + 哈希密码（独立注册 + 登录校验） ===== */
var Auth = {
  LS_USERS:'spark_chat_users_v1',
  hash:function(s){ var h=5381,i; s='sp@'+String(s); for(i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return 'h'+h.toString(36); },
  users:function(){ var u={}; try{ u=JSON.parse(SafeLS.getItem(this.LS_USERS)||'{}')||{}; }catch(e){} return u; },
  register:function(account, password, nickname){
    var u=this.users(), key=account.toLowerCase();
    if(u[key]) return { ok:false, error:'该账号已存在，请直接登录' };
    // 云端模式：账号目录已同步，别的设备注册过的账号不能重复注册
    if(Store.mode==='cloud' && CloudSync.profiles[key]) return { ok:false, error:'该账号已在云端存在，请直接登录' };
    var rec={ pass:this.hash(password), nickname:nickname||account, createdAt:nowISO() };
    u[key]=rec;
    SafeLS.setItem(this.LS_USERS, JSON.stringify(u));
    if(Store.mode==='cloud')
      CloudSync.publishProfile({ uid:key, username:account, nickname:rec.nickname, pass:rec.pass, createdAt:rec.createdAt });
    return { ok:true, me:{ id:idFromName(key), username:key, uid:key, nickname:rec.nickname } };
  },
  login:function(account, password){
    var u=this.users(), key=account.toLowerCase(), ph=this.hash(password);
    // 云端模式：本机没有这个账号时，用云端目录校验（别的设备注册的账号也能登录）
    if(!u[key] && Store.mode==='cloud'){
      var p=CloudSync.profiles[key];
      if(p && p.pass===ph){
        u[key]={ pass:p.pass, nickname:p.nickname||key, createdAt:p.createdAt||nowISO() };
        SafeLS.setItem(this.LS_USERS, JSON.stringify(u));   // 缓存到本机，下次免查云端
        return { ok:true, me:{ id:idFromName(key), username:key, uid:key, nickname:u[key].nickname } };
      }
    }
    if(!u[key]) return { ok:false, error:'账号不存在，请先注册' };
    if(u[key].pass!==ph) return { ok:false, error:'密码错误，请重试' };
    return { ok:true, me:{ id:idFromName(key), username:key, uid:key, nickname:u[key].nickname } };
  },
  // 用户目录：本机账号 +（云端模式）云端账号目录，供搜索加好友（不暴露密码）
  directory:function(){
    var u=this.users(), out=[], seen={};
    Object.keys(u).forEach(function(k){
      seen[k]=true;
      out.push({ uid:k, username:k, nickname:u[k].nickname||k, createdAt:u[k].createdAt||'' });
    });
    if(Store.mode==='cloud'){
      Object.keys(CloudSync.profiles).forEach(function(k){
        if(seen[k]) return;
        var p=CloudSync.profiles[k];
        out.push({ uid:k, username:k, nickname:p.nickname||k, createdAt:p.createdAt||'' });
      });
    }
    return out;
  }
};

/* ===== 社交 SOCIAL：好友申请 + 好友关系（本地存储） =====
   关系用稳定的账号 uid 标识，与消息 ownerId 解耦，避免大小写/历史数据导致串号。
   requests: [{id, from, fromName, to, toName, status, createdAt}]  status: pending/accepted/rejected
   friends : [{a, b, aName, bName, createdAt}]  —— 成对保存，双方便于查询 */
var Social = {
  LS:'spark_chat_social_v1',
  data:function(){
    // 云端模式：以云端事件流重放出来的状态为准，两台设备看到同一份好友关系
    if(Store.mode==='cloud') return CloudSync.state();
    var d={requests:[],friends:[]};
    try{ var x=JSON.parse(SafeLS.getItem(this.LS)||'{}')||{};
      d.requests=Array.isArray(x.requests)?x.requests:[];
      d.friends=Array.isArray(x.friends)?x.friends:[];
    }catch(e){}
    return d;
  },
  save:function(d){ SafeLS.setItem(this.LS, JSON.stringify(d)); },
  pendingRequest:function(from,to){
    return this.data().requests.filter(function(r){ return r.from===from && r.to===to && r.status==='pending'; })[0];
  },
  isFriend:function(a,b){
    return this.data().friends.some(function(f){ return (f.a===a&&f.b===b)||(f.a===b&&f.b===a); });
  },
  request:function(me, peer){
    var d=this.data(), meU=me.uid, peerU=peer.uid;
    if(meU===peerU) return {ok:false,error:'不能加自己为好友'};
    if(this.isFriend(meU,peerU)) return {ok:false,error:'对方已经是你的好友了'};
    if(this.pendingRequest(meU,peerU)) return {ok:false,error:'申请已发出，等待对方同意'};
    // 对方已向我发过申请 → 直接互相成为好友（避免两边各点一次）
    var reverse=d.requests.filter(function(r){ return r.from===peerU && r.to===meU && r.status==='pending'; })[0];
    if(Store.mode==='cloud'){
      // 追加事件而不是改整份数据，两台设备并发写也不会互相覆盖
      if(reverse) CloudSync.push({act:'accept', reqId:reverse.id, from:meU, to:reverse.from});
      else CloudSync.push({act:'request', reqId:uid(), from:meU, fromName:me.nickname, to:peerU, toName:peer.nickname});
      return {ok:true, auto:!!reverse};
    }
    if(reverse){
      reverse.status='accepted';
      d.friends.push({a:reverse.from,b:reverse.to,aName:reverse.fromName,bName:reverse.toName,createdAt:nowISO()});
      this.save(d);
      return {ok:true,auto:true};
    }
    d.requests.push({ id:uid(), from:meU, fromName:me.nickname, to:peerU, toName:peer.nickname,
      status:'pending', createdAt:nowISO() });
    this.save(d);
    return {ok:true};
  },
  respond:function(reqId, me, accept){
    var d=this.data(), r=d.requests.filter(function(x){ return x.id===reqId && x.to===me.uid; })[0];
    if(!r) return {ok:false,error:'申请不存在或不是发给你的'};
    if(Store.mode==='cloud'){
      CloudSync.push({act: accept?'accept':'reject', reqId:reqId, from:me.uid, to:r.from});
      return {ok:true};
    }
    r.status = accept?'accepted':'rejected';
    if(accept && !this.isFriend(r.from,r.to)){
      d.friends.push({a:r.from,b:r.to,aName:r.fromName,bName:r.toName,createdAt:nowISO()});
    }
    this.save(d);
    return {ok:true};
  },
  remove:function(me, peerUid){
    var meU=me.uid;
    if(Store.mode==='cloud'){
      CloudSync.push({act:'remove', a:meU, b:peerUid});
      return {ok:true};
    }
    var d=this.data();
    d.friends=d.friends.filter(function(f){ return !((f.a===meU&&f.b===peerUid)||(f.a===peerUid&&f.b===meU)); });
    d.requests=d.requests.filter(function(r){ return !((r.from===meU&&r.to===peerUid)||(r.from===peerUid&&r.to===meU)); });
    this.save(d);
    return {ok:true};
  },
  // 我的好友 -> [{uid,nickname}]
  friendsOf:function(me){
    var meU=me.uid;
    return this.data().friends.filter(function(f){ return f.a===meU||f.b===meU; }).map(function(f){
      return f.a===meU ? {uid:f.b,nickname:f.bName||f.b} : {uid:f.a,nickname:f.aName||f.a};
    });
  },
  incoming:function(me){ return this.data().requests.filter(function(r){ return r.to===me.uid && r.status==='pending'; }); },
  outgoing:function(me){ return this.data().requests.filter(function(r){ return r.from===me.uid && r.status==='pending'; }); }
};

/* ===== 数据层 STORE：云端 / 本地 双模式 ===== */
var Store = {
  mode:'local', db:null, app:null, _queue:Promise.resolve(),
  LS_MSG:'spark_chat_messages_v1', LS_RATE:'spark_chat_rate_v1',
  init:function(){
    var self=this;
    if(CFG.env && typeof window.cloudbase!=='undefined'){
      try{
        self.app = cloudbase.init({ env: CFG.env });
        var auth = self.app.auth({ persistence:'local' });
        return Promise.resolve(auth.getLoginState && auth.getLoginState())
          .then(function(state){ if(!state) return auth.signInAnonymously(); })
          .then(function(){ self.db=self.app.database(); self.mode='cloud'; })
          .catch(function(e){ console.warn('云模式失败，降级本地：',e); self.mode='local'; });
      }catch(e){ console.warn('云 SDK 异常，降级本地：',e); self.mode='local'; }
    }
    self.mode='local';
    return Promise.resolve();
  },
  list:function(){
    if(this.mode==='cloud'){
      return this.db.collection(CFG.collection).orderBy('createdAt','asc').limit(1000).get()
        .then(function(r){ return r.data||[]; })
        .catch(function(e){ console.warn('读取云端失败',e); return []; });
    }
    var a=[]; try{ a=JSON.parse(SafeLS.getItem(this.LS_MSG)||'[]'); }catch(e){}
    return Promise.resolve(a);
  },
  add:function(msg){
    if(this.mode==='cloud') return this.db.collection(CFG.collection).add(msg);
    var self=this;
    // 串行写入，避免同时 add（欢迎语 + 首条消息）互相覆盖导致消息丢失
    var task = this._queue.then(function(){
      return self.list().then(function(a){
        a.push(msg); if(a.length>500) a=a.slice(-500);
        SafeLS.setItem(self.LS_MSG, JSON.stringify(a));
      });
    });
    this._queue = task.catch(function(){});
    return task;
  },
  remove:function(id, ownerId){
    var self=this;
    if(this.mode==='cloud'){
      return this.db.collection(CFG.collection).where({mid:id, ownerId:ownerId}).get()
        .then(function(r){
          if(!r.data||!r.data.length) throw new Error('只能删除自己的消息');
          return self.db.collection(CFG.collection).doc(r.data[0]._id).remove();
        });
    }
    return this.list().then(function(a){
      a=a.filter(function(m){ return !(m.mid===id && m.ownerId===ownerId); });
      SafeLS.setItem(self.LS_MSG, JSON.stringify(a));
    });
  }
};

/* ===== 云端同步 CloudSync：账号目录 + 好友关系上云 =====
   只在云端模式生效；本地模式完全不走这里，行为保持不变。
   复用同一个 chat_messages 集合，不需要在控制台新建集合：
     kind='profile'  账号目录（uid / nickname / pass 哈希 / createdAt）
     kind='social'   好友关系事件流（append-only，多设备并发不会互相覆盖）
   查询函数全部保持同步：由本对象内存缓存供数，refresh() 轮询时从云端吸收最新记录。 */
var CloudSync = {
  profiles:{},            // uid -> profile 记录
  events:{},              // mid -> 云端已确认的 social 事件
  pending:{},             // mid -> 已提交但云端尚未回读的 social 事件
  _localPublished:false,

  absorb:function(list){
    var self=this;
    (list||[]).forEach(function(m){
      if(!m) return;
      if(m.kind==='profile' && m.uid){
        var old=self.profiles[m.uid];
        if(!old || String(m.createdAt||'')>=String(old.createdAt||'')) self.profiles[m.uid]=m;
      }else if(m.kind==='social' && m.mid){
        self.events[m.mid]=m;
        delete self.pending[m.mid];   // 云端已回读，撤下待确认标记
      }
    });
  },

  publishProfile:function(rec){
    var r={ mid:uid(), kind:'profile', uid:rec.uid, username:rec.username||rec.uid,
      nickname:rec.nickname||rec.uid, pass:rec.pass, createdAt:rec.createdAt||nowISO(),
      ownerId:'sys', ownerName:'账号目录' };
    this.profiles[r.uid]=r;
    Promise.resolve(Store.add(r)).catch(function(e){ console.warn('账号目录上云失败：',e); });
    return r;
  },

  // 把「填 env 之前在本机注册过的账号」补进云端目录，保证老账号也能被别的设备搜到
  publishLocalUsers:function(){
    if(Store.mode!=='cloud' || this._localPublished) return;
    this._localPublished=true;
    var u=Auth.users(), self=this;
    Object.keys(u).forEach(function(k){
      if(!self.profiles[k])
        self.publishProfile({ uid:k, username:k, nickname:u[k].nickname||k,
          pass:u[k].pass, createdAt:u[k].createdAt });
    });
  },

  push:function(act){
    var e={ mid:uid(), kind:'social', act:act.act, reqId:act.reqId||'',
      from:act.from||'', fromName:act.fromName||'', to:act.to||'', toName:act.toName||'',
      a:act.a||'', b:act.b||'', aName:act.aName||'', bName:act.bName||'',
      createdAt:nowISO(), ownerId:(state.me?state.me.id:'sys'),
      ownerName:(state.me?state.me.nickname:'系统') };
    this.pending[e.mid]=e;          // 立即进缓存，本机界面马上能看到结果
    Promise.resolve(Store.add(e)).catch(function(err){ console.warn('好友关系上云失败：',err); });
    return e;
  },

  // 把事件流重放成 {requests, friends}，结构与本地 Social.data() 完全一致
  state:function(){
    var all={}, self=this;
    Object.keys(this.events).forEach(function(k){ all[k]=self.events[k]; });
    Object.keys(this.pending).forEach(function(k){ if(!all[k]) all[k]=self.pending[k]; });
    var evs=Object.keys(all).map(function(k){ return all[k]; })
      .sort(function(x,y){ return String(x.createdAt||'').localeCompare(String(y.createdAt||'')); });
    var reqs={}, frs={};
    function pair(a,b){ return a<b ? a+'|'+b : b+'|'+a; }
    function addFriend(a,b,aName,bName,t){
      if(!a||!b||a===b) return;
      frs[pair(a,b)]={a:a,b:b,aName:aName||a,bName:bName||b,createdAt:t||nowISO()};
    }
    evs.forEach(function(e){
      if(e.act==='request'){
        reqs[e.reqId]={ id:e.reqId, from:e.from, fromName:e.fromName, to:e.to, toName:e.toName,
          status:'pending', createdAt:e.createdAt };
      }else if(e.act==='accept'){
        var r=reqs[e.reqId];
        if(r){ r.status='accepted'; addFriend(r.from,r.to,r.fromName,r.toName,e.createdAt); }
      }else if(e.act==='reject'){
        if(reqs[e.reqId]) reqs[e.reqId].status='rejected';
      }else if(e.act==='friend'){
        addFriend(e.a,e.b,e.aName,e.bName,e.createdAt);
      }else if(e.act==='remove'){
        delete frs[pair(e.a,e.b)];
        Object.keys(reqs).forEach(function(id){
          var r=reqs[id];
          if((r.from===e.a&&r.to===e.b)||(r.from===e.b&&r.to===e.a)) delete reqs[id];
        });
      }
    });
    return { requests:Object.keys(reqs).map(function(k){ return reqs[k]; }),
             friends:Object.keys(frs).map(function(k){ return frs[k]; }) };
  }
};

var Rate = {
  check:function(ownerId){
    var t=Date.now(), map={};
    try{ map=JSON.parse(SafeLS.getItem(Store.LS_RATE)||'{}'); }catch(e){}
    var arr=(map[ownerId]||[]).filter(function(x){ return t-x < CFG.rateWindowMs; });
    if(arr.length>=CFG.rateMax){
      return { ok:false, wait:Math.ceil((CFG.rateWindowMs-(t-arr[0]))/1000) };
    }
    arr.push(t); map[ownerId]=arr;
    SafeLS.setItem(Store.LS_RATE, JSON.stringify(map));
    return { ok:true };
  }
};

var AI = {
  // 本地规则：离线可用 / 云函数未配置或失败时自动降级
  localAnswer:function(q){

    if(/架构|技术|前后端|什么语言|怎么实现/.test(s))
      return '发布到腾讯云开发「网站托管」：前端是原生 HTML/CSS/JS，数据存在云数据库（填 env 后自动切换），未配置环境时自动用浏览器本地存储做演示。';
    if(/数据库|表|集合|存哪/.test(s))
      return '云端用云数据库集合 '+CFG.collection+'，每条消息含 mid、ownerId、ownerName、content、kind、createdAt。本地模式数据存在浏览器 localStorage。老师可用数据库工具查看云端集合。';
    if(/隔离|owner|权限|删除|个人|只看我的/.test(s))
      return '每条消息都有 ownerId（由账号生成，稳定唯一）。「个人」视图按 ownerId 过滤；删除时服务端/本地都会校验 ownerId，只能删自己的消息。';
    if(/限流|刷屏|频率/.test(s))
      return '限流用滑动窗口：每个身份 60 秒内最多 '+CFG.rateMax+' 条，超限会提示还需等待的秒数，前端按钮也会暂时禁用。';
    if(/域名|发布|上线|网址|腾讯云/.test(s))
      return '在腾讯云开发控制台开通环境 → 开启匿名登录 → 建 '+CFG.collection+' 集合 → 把 index.html 上传到「网站托管」，系统会分配一个免费域名，老师打开即可使用。';
    if(/成员|几个人|几个人聊|多人/.test(s))
      return '这是群聊大厅：所有人看到的消息在同一条时间线上，但每条都标注了 owner_id。发布到云端后，同一网址的不同人就能一起聊。';
    return '我还在学习中～ 你可以问我：这个项目是什么架构？数据库存哪？owner_id 怎么隔离？怎么限流？怎么发布拿域名？';
  },
  // 统一入口：返回 Promise<string>。云端可用时调扣子，否则回退本地规则。
  // history：最近的对话轮次 [{role:'user'|'assistant', content}]，让扣子"记得"前文
  answer:function(q, userId, history){
    var self=this, text=String(q||'');
    if(!CFG.aiProxyUrl) return Promise.resolve(self.localAnswer(text));
    var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, CFG.aiTimeoutMs||40000) : null;
    var opts = {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ question:text, userId:userId||'guest', history:history||[] })
    };
    if(ctrl) opts.signal=ctrl.signal;
    return fetch(CFG.aiProxyUrl, opts)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok && d.answer) return String(d.answer);
        throw new Error((d && d.error) || '云端未返回答案');
      })
      .catch(function(e){
        console.warn('云端 AI 不可用，降级本地规则：', e && e.message);
        return self.localAnswer(text);
      })
      .then(function(ans){ if(timer) clearTimeout(timer); return ans; });
  }
};

function applyTheme(t){

    var b=$(id); if(b) b.classList.toggle('is-dark',dark);
  });
}

  var t=null;

  if(t!=='dark' && t!=='light'){
    t=(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }
  applyTheme(t);
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';

function bubbleStyle(){
  var v=document.documentElement.getAttribute('data-bubble');
  return BUBBLE_STYLES.some(function(s){ return s.id===v; })?v:'classic';
}
function cuteDeco(){
  var d=CUTE_DECO[bubbleStyle()];
  if(!d) return '';
  return d.map(function(x){
    var txt=(x==='spark'||x==='spark2')?'✦':'';
    if(x==='capy-face') txt=CAPY_FACE_IMG;
    return '<span class="bd bd-'+x+'">'+txt+'</span>';
  }).join('');
}
/* 所有气泡统一走这个入口，保证萌系装饰对文字 / 图片 / 文件 / 语音 / 表情包都生效 */
function bubbleHTML(content, cls){
  return '<div class="bubble'+(cls?' '+cls:'')+'">'+cuteDeco()+content+'</div>';
}
function applyBubble(id){
  if(!BUBBLE_STYLES.some(function(s){ return s.id===id; })) id='classic';
  document.documentElement.setAttribute('data-bubble',id);
  var s=BUBBLE_STYLES.filter(function(x){ return x.id===id; })[0];
  var cur=$('bpCurrent'); if(cur && s) cur.textContent=s.name;
  var list=$('bpList');
  if(list) list.querySelectorAll('.bp-item').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-bp')===id);
  });
  var btn=$('btnBubble'), pop=$('bubblePop');
  if(btn && pop) btn.setAttribute('aria-expanded', pop.style.display!=='none'?'true':'false');
}
function initBubble(){
  var t=null;
  try{ t=SafeLS.getItem(BUBBLE_KEY); }catch(e){}
  applyBubble(t||'classic');
}
function bpCard(s){
  var cute=s.group==='cute';
  var st=cute?(' style="--bp-frame:'+s.frame+'"'):'';
  var pv='<span class="bp-preview bp-'+s.pv+(cute?' bp-cute':'')+'"'+st+'><i></i><b></b>'
    +(s.id==='cute-duck'?'<u class="bp-mini-capy">'+CAPY_FACE_IMG+'</u>':'')+'</span>';
  return '<button class="bp-item" type="button" data-bp="'+s.id+'" role="menuitem">'
    +pv
    +'<span class="bp-text"><span class="bp-name">'+esc(s.name)+'</span>'
    +'<span class="bp-desc">'+esc(s.desc)+'</span></span>'
    +'<svg class="ic bp-check"><use href="#i-check"></use></svg></button>';
}
function renderBubblePop(){
  var list=$('bpList'); if(!list) return;
  if(!list.childNodes.length){
    var html='';
    BUBBLE_GROUPS.forEach(function(g){
      html+='<div class="bp-sec">'+esc(g.name)+'</div>'
        + BUBBLE_STYLES.filter(function(s){ return s.group===g.key; }).map(bpCard).join('');
    });
    list.innerHTML=html;
    list.querySelectorAll('.bp-item').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-bp');
        applyBubble(id);
        try{ SafeLS.setItem(BUBBLE_KEY,id); }catch(e){}
        closeBubblePop();
        refresh();   // 卡通装饰由 render() 注入，切换后立刻重绘
        var s=BUBBLE_STYLES.filter(function(x){ return x.id===id; })[0];
        toast('已换上「'+(s?s.name:id)+'」气泡','ok');
      });
    });
  }
  applyBubble(bubbleStyle());
}
function toggleBubblePop(force){
  var p=$('bubblePop'); if(!p) return;
  var open=(typeof force==='boolean')?force:(p.style.display==='none');
  p.style.display=open?'block':'none';
  $('btnBubble').setAttribute('aria-expanded',open?'true':'false');
  if(open) renderBubblePop();
}
function closeBubblePop(){ toggleBubblePop(false); }
