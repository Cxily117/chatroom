function bubbleStyle(){
  var v=document.documentElement.getAttribute('data-bubble');
  return BUBBLE_STYLES.some(function(s){ return s.id===v; })?v:'classic';
}
function cuteDeco(){
  var d=CUTE_DECO[bubbleStyle()];
  if(!d) return '';
  return d.map(function(x){
    var txt=(x==='spark'||x==='spark2')?'✦':'';
    if(x==='capy-face') txt=CAPY_FACE_IMG;
    return '<span class="bd bd-'+x+'">'+txt+'</span>';
  }).join('');
}
/* 所有气泡统一走这个入口，保证萌系装饰对文字 / 图片 / 文件 / 语音 / 表情包都生效 */
function bubbleHTML(content, cls){
  return '<div class="bubble'+(cls?' '+cls:'')+'">'+cuteDeco()+content+'</div>';
}
function applyBubble(id){
  if(!BUBBLE_STYLES.some(function(s){ return s.id===id; })) id='classic';
  document.documentElement.setAttribute('data-bubble',id);
  var s=BUBBLE_STYLES.filter(function(x){ return x.id===id; })[0];
  var cur=$('bpCurrent'); if(cur && s) cur.textContent=s.name;
  var list=$('bpList');
  if(list) list.querySelectorAll('.bp-item').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-bp')===id);
  });
  var btn=$('btnBubble'), pop=$('bubblePop');
  if(btn && pop) btn.setAttribute('aria-expanded', pop.style.display!=='none'?'true':'false');
}
function initBubble(){
  var t=null;
  try{ t=SafeLS.getItem(BUBBLE_KEY); }catch(e){}
  applyBubble(t||'classic');
}
function bpCard(s){
  var cute=s.group==='cute';
  var st=cute?(' style="--bp-frame:'+s.frame+'"'):'';
  var pv='<span class="bp-preview bp-'+s.pv+(cute?' bp-cute':'')+'"'+st+'><i></i><b></b>'
    +(s.id==='cute-duck'?'<u class="bp-mini-capy">'+CAPY_FACE_IMG+'</u>':'')+'</span>';
  return '<button class="bp-item" type="button" data-bp="'+s.id+'" role="menuitem">'
    +pv
    +'<span class="bp-text"><span class="bp-name">'+esc(s.name)+'</span>'
    +'<span class="bp-desc">'+esc(s.desc)+'</span></span>'
    +'<svg class="ic bp-check"><use href="#i-check"></use></svg></button>';
}
function renderBubblePop(){
  var list=$('bpList'); if(!list) return;
  if(!list.childNodes.length){
    var html='';
    BUBBLE_GROUPS.forEach(function(g){
      html+='<div class="bp-sec">'+esc(g.name)+'</div>'
        + BUBBLE_STYLES.filter(function(s){ return s.group===g.key; }).map(bpCard).join('');
    });
    list.innerHTML=html;
    list.querySelectorAll('.bp-item').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-bp');
        applyBubble(id);
        try{ SafeLS.setItem(BUBBLE_KEY,id); }catch(e){}
        closeBubblePop();
        refresh();   // 卡通装饰由 render() 注入，切换后立刻重绘
        var s=BUBBLE_STYLES.filter(function(x){ return x.id===id; })[0];
        toast('已换上「'+(s?s.name:id)+'」气泡','ok');
      });
    });
  }
  applyBubble(bubbleStyle());
}
function toggleBubblePop(force){
  var p=$('bubblePop'); if(!p) return;
  var open=(typeof force==='boolean')?force:(p.style.display==='none');
  p.style.display=open?'block':'none';
  $('btnBubble').setAttribute('aria-expanded',open?'true':'false');
  if(open) renderBubblePop();
}
function closeBubblePop(){ toggleBubblePop(false); }

var PET_ACTS=[
  {tag:'打招呼',say:'嗨～我是小星！点我再换个动作呀 ✦',pose:'wave'},
  {tag:'思考中',say:'嗯……让我想想这个问题～',        pose:'think'},

  {tag:'答疑',  say:'带 @小星 发消息，我就来接话啦',   pose:'teach'}
];
var petAct=0, petSayTimer=null;
function cyclePet(){
  petAct=(petAct+1)%PET_ACTS.length;
  var a=PET_ACTS[petAct], pet=$('aiPet');
  pet.setAttribute('data-act',petAct);
  pet.setAttribute('data-pose',a.pose);
  $('petTag').textContent='# '+a.tag;
  var say=$('petSay');
  say.textContent=a.say; say.style.display='block';
  say.classList.remove('show'); void say.offsetWidth; say.classList.add('show');
  if(petSayTimer) clearTimeout(petSayTimer);
  petSayTimer=setTimeout(function(){ say.style.display='none'; },2800);
}
function initPet(){
  var pet=$('aiPet'), start=null, moved=false, main=document.querySelector('.main');
  pet.addEventListener('pointerdown',function(e){
    if(e.target.closest && e.target.closest('.pet-x,.pet-ask')) return;
    var r=pet.getBoundingClientRect(), m=main.getBoundingClientRect();
    start={x:e.clientX,y:e.clientY,l:r.left-m.left,t:r.top-m.top}; moved=false;
    try{ pet.setPointerCapture(e.pointerId); }catch(err){}
  });
  pet.addEventListener('pointermove',function(e){
    if(!start) return;
    var dx=e.clientX-start.x, dy=e.clientY-start.y;
    if(Math.abs(dx)+Math.abs(dy)>5) moved=true;
    if(moved){
      pet.style.left=Math.max(0,Math.min(start.l+dx,main.clientWidth-100))+'px';
      pet.style.top=Math.max(0,start.t+dy)+'px';
      pet.style.right='auto'; pet.style.bottom='auto';
    }
  });
  pet.addEventListener('pointerup',function(){
    if(!start) return;
    start=null;
    if(!moved) cyclePet();
  });
  pet.addEventListener('pointercancel',function(){ start=null; });
}
function hidePet(){
  $('aiPet').style.display='none'; $('petRestore').style.display='block';
  toast('小星收起来啦，点右下角可以唤回','ok');

function avatarClass(m){

  if(m.kind==='system') return 'av-sys';
  var s=String(m.ownerName||m.ownerId||'?'), h=0;
  for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; }
  return 'av-'+(Math.abs(h)%8);        // 同一昵称永远同一种配色
}
function timeLabel(iso){
  var d=new Date(iso); if(isNaN(d.getTime())) return '';
  var now=new Date(), y=new Date(now.getTime()-86400000);
  var hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  if(d.toDateString()===now.toDateString()) return '今天 '+hm;
  if(d.toDateString()===y.toDateString()) return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}

function rippleDelegate(e){
  var b=(e.target && e.target.closest) ? e.target.closest('.btn,.send,.imgbtn,.fr-btn,.fr-tab,.mbtn') : null;
  if(!b) return;
  var r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)*1.2;
  var s=document.createElement('span'); s.className='ripple';
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px';
  s.style.top=(e.clientY-r.top-d/2)+'px';
  b.appendChild(s);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },600);
}

function enter(me){
  state.me = me;
  try{ SafeLS.setItem('spark_chat_me', JSON.stringify(state.me)); }catch(e){}
  $('entry').style.display='none';
  $('chat').style.display='flex';
  $('meName').textContent=me.nickname;
  $('meId').textContent='@'+me.username;
  $('meAvatar').textContent=me.nickname.slice(0,1);
  $('msgs').innerHTML=skeletonHTML();   // 云端拉取期间先显示骨架屏
  seedWelcome();
  refresh();
  if(state.timer) clearInterval(state.timer);
  state.timer=setInterval(refresh, CFG.pollMs);
}

function seedWelcome(){
  Store.list().then(function(a){
    var has = a.some(function(m){ return m.kind==='system'; });
    if(!has){
      return Store.add({ mid:uid(), ownerId:'system', ownerName:'系统', content:'欢迎来到星火聊天室！可以发图片 / 文件 / 语音 / 表情包，侧栏「好友」能加好友私聊，「数据库」里有消息表 / 账号表 / 好友关系表三张原始表。右下角悬浮的小星点一下会换动作，消息里带 @小星 就能让它接话。右上角可以切换亮 / 暗主题，还有 13 套个性装扮气泡随你挑～', kind:'system', createdAt:nowISO() });
    }
  }).then(refresh).catch(function(){});
}

function refresh(){
  Store.list().then(function(all){
    // 云端模式：先吸收账号目录 / 好友关系记录到缓存，再把它们从聊天消息里排除
    if(Store.mode==='cloud') CloudSync.absorb(all);
    var list=(all||[]).filter(function(m){ return m && m.kind!=='profile' && m.kind!=='social'; });
    if(state.scope==='db'){ renderDb(list); return; }
    if(state.scope==='friends'){
      // 「找人」搜索框在 msgs 区域内：轮询整体重绘会清空正在输入的内容、打断中文输入法。
      // 输入框聚焦时跳过本轮；好友/申请数据存本机，用户主动操作会显式调 renderFriends 刷新。
      var fq=$('frQuery');
      if(fq && fq===document.activeElement) return;
      renderFriends(); return;
    }
    if(state.scope==='dm'){
      var p=state.pmPeer;
      if(!p){ box_noop(); return; }
      list=list.filter(function(m){
        if(!m.dm) return false;
        var a=m.ownerUid, b=m.toUid;
        return (a===state.me.uid && b===p.uid) || (a===p.uid && b===state.me.uid);
      });
      render(list); return;
    }
    // 群聊大厅 / 个人视图：严格排除私聊消息，避免串消息
    list=list.filter(function(m){ return !m.dm; });
    if(state.scope==='mine') list=list.filter(function(m){ return m.ownerId===state.me.id; });
    render(list);
  });
}

function dbUsersHTML(cloud){
  var local=Auth.users(), rows=[], seen={};
  Object.keys(local).forEach(function(k){
    seen[k]=true;
    var u=local[k]||{};
    rows.push({uid:k,nick:u.nickname||k,pass:u.pass||'',createdAt:u.createdAt||'',from:'本机'});
  });
  if(cloud){
    Object.keys(CloudSync.profiles).forEach(function(k){
      if(seen[k]){
        rows.forEach(function(r){ if(r.uid===k) r.from='本机 + 云端'; });
        return;
      }
      var p=CloudSync.profiles[k];
      rows.push({uid:k,nick:p.nickname||k,pass:p.pass||'',createdAt:p.createdAt||'',from:'云端'});
    });
  }
  var note='<div class="db-note">这张表存的是<b>注册 / 登录用的账号</b>，和上面的消息表是两套独立数据。'

    +'⚠ 课堂演示边界：本地账号只在这台浏览器有效；云端集合若设为「所有用户可读写」，哈希对访问者可读，正式产品应改为云函数 + 服务端校验。</div>';
  var rs=rows.length?rows.map(function(r){
    var ph=String(r.pass||'');
    var mask=ph?(ph.slice(0,6)+' …（已遮罩 · 共 '+ph.length+' 位）'):'—';
    return '<tr><td class="mono">'+esc(r.uid)+'</td><td>'+esc(r.nick)+'</td>'

      +'<td class="mono">'+esc((r.createdAt||'').replace('T',' ').slice(0,19))+'</td></tr>';
  }).join(''):'';
  return note+dbTable('<th>账号 uid</th><th>昵称</th><th>密码哈希（遮罩）</th><th>数据来源</th><th>注册时间</th>',rs,'还没有注册账号，退出后注册一个就能在这里看到',5);

/* 附件数据缓存：mid -> {data,name}。渲染时只放一个 data-att 标记，
   避免把几十/几百 KB 的 base64 塞进 innerHTML；点击时才从缓存取，安全且快。 */
var ATT_CACHE = {};
function safeDataURL(s){ return (typeof s==='string' && s.indexOf('data:')===0) ? s : ''; }

function render(list){
  var box=$('msgs');
  if(!list.length){ box.innerHTML=emptyHTML('还没有消息，来发第一条吧'); return; }
  // 用户正在往上翻历史时，轮询重绘不要把视线强行拉回底部；切换视图则回到最新消息
  var forceBottom = LAST_SCOPE !== state.scope;
  LAST_SCOPE = state.scope;
  var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  ATT_CACHE = {};
  var nextSeen={}, hasNew=false, prev=null, parts=[];
  list.forEach(function(m,i){
    var mine = state.me && m.ownerId===state.me.id;
    var isNew = !SEEN[m.mid];
    if(isNew) hasNew=true;
    nextSeen[m.mid]=true;
    // 时间分组：与上一条相隔超过 10 分钟就插一条日期分隔线
    var tCur=new Date(m.createdAt).getTime();
    var tPrev=prev?new Date(prev.createdAt).getTime():NaN;
    var gap=(!isNaN(tCur)&&!isNaN(tPrev))?(tCur-tPrev):Infinity;
    var sep=(i===0)||gap>10*60*1000;
    if(sep) parts.push('<div class="day-sep"><span>'+esc(timeLabel(m.createdAt))+'</span></div>');
    // 同一人 2 分钟内的连续消息：收起重复头像与昵称，收拢间距
    var tight=!sep && prev && prev.ownerId===m.ownerId && prev.kind===m.kind && gap<2*60*1000;
    var cls='msg'+(mine?' mine':'')+(m.kind==='ai'?' ai':'')+(tight?' tight':'')+(isNew?' enter':'');
    var del = mine ? '<button class="op-del" data-mid="'+esc(m.mid)+'" title="删除这条消息">删除</button>' : '';
    var who = m.kind==='ai' ? '小星 · 智能助手'
            : m.kind==='system' ? '系统公告'
            : esc(m.ownerName);
    var pmTag = m.dm ? '<span class="pm-badge">私聊'+(m.toName?' → '+esc(m.toName):'')+'</span>' : '';
    // 附件优先级：图片 > 文件 > 语音 > 表情包 > 文字；只信任 data: 前缀 / 白名单 id，杜绝注入
    var inner;
    if(typeof m.image==='string' && m.image.indexOf('data:image/')===0){
      inner = bubbleHTML('<img class="zoomable" src="'+esc(m.image)+'" alt="图片">'
            + (m.content && m.content!=='[图片]' ? '<div class="img-cap">'+esc(m.content)+'</div>' : ''),'hasimg');
    }else if(m.file && safeDataURL(m.file.data)){
      ATT_CACHE[m.mid]={data:m.file.data, name:m.file.name||'下载文件'};
      inner = bubbleHTML('<div class="file-card">'
            + '<div class="file-ico">'+esc(FILE.ext(m.file.name))+'</div>'
            + '<div class="file-meta"><div class="file-name" title="'+esc(m.file.name)+'">'+esc(m.file.name)+'</div>'
            + '<div class="file-size">'+esc(FILE.kb(m.file.size))+' · '+esc(m.file.type||'未知类型')+'</div></div>'
            + '<button class="file-dl" data-dl="'+esc(m.mid)+'">下载</button>'
            + '</div>'+(m.content && m.content.indexOf('[文件]')!==0 ? '<div class="img-cap">'+esc(m.content)+'</div>':''),'hasatt');
    }else if(m.audio && safeDataURL(m.audio.data)){
      ATT_CACHE[m.mid]={data:m.audio.data, name:'语音消息'};
      var dur=m.audio.dur||1;
      var bars=''; for(var j=0;j<18;j++){ bars+='<i style="height:'+(5+((j*7+3)%15))+'px"></i>'; }
      inner = bubbleHTML('<div class="voice-card">'
            + '<button class="voice-play" data-play="'+esc(m.mid)+'" title="播放语音">▶</button>'
            + '<div class="voice-track"><div class="voice-bars">'+bars+'</div>'
            + '<div class="voice-time">🔊 '+dur+'″ 语音 · 点击播放</div></div></div>','hasatt');
    }else if(m.sticker && STICKER_BY_ID[m.sticker]){
      var st=STICKER_BY_ID[m.sticker];
      inner = bubbleHTML('<div class="sticker-box">'+stickerSVG(m.sticker)
            +'<div class="sticker-cap">'+esc(st.name)+'</div></div>','sticker-bub');
    }else{
      inner = bubbleHTML(esc(m.content));
    }
    parts.push('<div class="'+cls+'"><div class="mav '+avatarClass(m)+'">'+esc((m.ownerName||'?').slice(0,1))+'</div>'+
      '<div class="body"><div class="meta"><span class="who">'+who+'</span>'+pmTag+
      '<span class="mtime">'+hhmm(m.createdAt)+'</span>'+del+'</div>'+inner+'</div></div>');
    prev=m;
  });
  // 累积而非替换：切换视图再回来时，旧消息不会重播入场动画
  Object.keys(nextSeen).forEach(function(k){ SEEN[k]=true; });
  box.innerHTML=parts.join('');
  // AI 思考中：插一条"正在输入"的临时气泡（不进 SEEN，不写入数据库）
  if(state.asking && (state.scope==='all'||state.scope==='mine')){
    box.insertAdjacentHTML('beforeend','<div class="msg ai typing"><div class="mav av-sys">✦</div><div class="body">'+
      '<div class="meta"><span class="who">小星 · 智能助手</span><span class="mtime">正在输入</span></div>'+
      '<div class="bubble">'+cuteDeco()+'<i></i><i></i><i></i></div></div></div>');
  }
  if(forceBottom || atBottom || hasNew) box.scrollTop=box.scrollHeight;
  box.querySelectorAll('[data-mid]').forEach(function(b){
    b.addEventListener('click',function(){
      confirmBox('确定删除这条消息吗？只能删除自己的消息。', function(){
        Store.remove(b.getAttribute('data-mid'), state.me.id).then(refresh)
          .catch(function(e){ toast(e.message,'err'); });
      });
    });
  });
  box.querySelectorAll('.zoomable').forEach(function(im){
    im.addEventListener('click',function(){ openLightbox(im.src); });
  });
  // 文件下载：从缓存取 dataURL，临时创建 <a download> 触发保存
  box.querySelectorAll('[data-dl]').forEach(function(b){
    b.addEventListener('click',function(){
      var a=ATT_CACHE[b.getAttribute('data-dl')];
      if(!a){ toast('附件已失效，请刷新','err'); return; }
      var link=document.createElement('a');
      link.href=a.data; link.download=a.name; document.body.appendChild(link);
      link.click(); document.body.removeChild(link);
    });
  });
  // 语音播放：从缓存取音频，用 Audio 对象播放并高亮按钮
  box.querySelectorAll('[data-play]').forEach(function(b){
    b.addEventListener('click',function(){
      var a=ATT_CACHE[b.getAttribute('data-play')];
      if(!a){ toast('语音已失效，请刷新','err'); return; }
      if(state._audio){ try{ state._audio.pause(); }catch(e){} }
      if(state._playBtn){ state._playBtn.textContent='▶'; }
      var au=new Audio(a.data); state._audio=au; state._playBtn=b;
      b.textContent='⏸';
      au.play().catch(function(e){ b.textContent='▶'; toast('播放失败：'+(e&&e.message),'err'); });
      au.onended=function(){ b.textContent='▶'; state._audio=null; state._playBtn=null; };
    });
  });
}

function openLightbox(src){
  var lb=$('lightbox');
  $('lightboxImg').src=src;
  lb.style.display='flex';
  lb.classList.remove('show'); void lb.offsetWidth; lb.classList.add('show');
}

/* ===== 好友视图：搜索加好友 / 处理申请 / 好友列表 / 发起私聊 ===== */
function renderFriends(){
  var box=$('msgs'), me=state.me, tab=state.frTab||'friends';
  var incoming=Social.incoming(me), outgoing=Social.outgoing(me), friends=Social.friendsOf(me);
  var tabs = '<div class="fr-tabs">'
    + '<button class="fr-tab'+(tab==='friends'?' active':'')+'" data-tab="friends">好友 '+friends.length+'</button>'
    + '<button class="fr-tab'+(tab==='find'?' active':'')+'" data-tab="find">找人</button>'
    + '<button class="fr-tab'+(tab==='req'?' active':'')+'" data-tab="req">申请'+(incoming.length?'<span class="cnt">'+incoming.length+'</span>':'')+'</button>'
    + '</div>';
  var note = Store.mode==='cloud'
    ? '<div class="fr-note">当前是<b>云端数据库模式</b>：账号目录和好友关系已同步到云端。两台设备打开同一个网址、各自注册账号后，就能在「找人」里互相搜到、加好友、私聊（约 2~3 秒同步一次）。</div>'
    : '<div class="fr-note">账号注册在本机浏览器中，所以「找人」列出的是<b>这台设备上注册过的账号</b>。'
      + '想演示完整流程：先注册 A，退出后再注册 B → B 搜 A 发申请 → 退出用 A 登录 → 在「申请」里同意 → 双方即可私聊。'
      + '要真正跨设备加好友，按部署指南填环境 ID 发布到云端即可。</div>';
  var body='';
  if(tab==='find'){
    body = '<div class="fr-search"><input id="frQuery" type="text" placeholder="输入对方账号（支持模糊搜索）" maxlength="24" value="'+esc(state.frQuery||'')+'">'
      + '<button id="frSearchBtn">搜索</button></div><div id="frResult"></div>';
  }else if(tab==='req'){
    var h='<div class="fr-sec">收到的申请（'+incoming.length+'）</div>';
    if(!incoming.length) h+='<div class="fr-empty">暂时没有收到的申请</div>';
    incoming.forEach(function(r){
      h+='<div class="fr-row"><div class="fr-av">'+esc((r.fromName||'?').slice(0,1))+'</div>'
        +'<div class="fr-info"><div class="fr-nm">'+esc(r.fromName||r.from)+' 想加你为好友</div>'
        +'<div class="fr-id">@'+esc(r.from)+' · '+hhmm(r.createdAt)+'</div></div>'
        +'<div class="fr-ops"><button class="fr-btn ok" data-accept="'+esc(r.id)+'">同意</button>'
        +'<button class="fr-btn no" data-reject="'+esc(r.id)+'">拒绝</button></div></div>';
    });
    h+='<div class="fr-sec">我发出的申请（'+outgoing.length+'）</div>';
    if(!outgoing.length) h+='<div class="fr-empty">还没有发出申请，去「找人」里添加吧</div>';
    outgoing.forEach(function(r){
      h+='<div class="fr-row"><div class="fr-av">'+esc((r.toName||'?').slice(0,1))+'</div>'
        +'<div class="fr-info"><div class="fr-nm">@'+esc(r.to)+'</div>'
        +'<div class="fr-id">等待对方同意 · '+hhmm(r.createdAt)+'</div></div>'
        +'<div class="fr-ops"><span class="fr-btn" style="cursor:default">待处理</span></div></div>';
    });
    body=h;
  }else{
    var b='<div class="fr-sec">我的好友（'+friends.length+'）</div>';
    if(!friends.length) b+='<div class="fr-empty">还没有好友，点上方「找人」添加第一个吧</div>';
    friends.forEach(function(f){
      b+='<div class="fr-row"><div class="fr-av">'+esc((f.nickname||'?').slice(0,1))+'</div>'
        +'<div class="fr-info"><div class="fr-nm">'+esc(f.nickname)+'</div>'
        +'<div class="fr-id">@'+esc(f.uid)+'</div></div>'
        +'<div class="fr-ops"><button class="fr-btn pri" data-chat="'+esc(f.uid)+'" data-nick="'+esc(f.nickname)+'">私聊</button>'
        +'<button class="fr-btn no" data-unfriend="'+esc(f.uid)+'">删除</button></div></div>';
    });
    body=b;
  }
  box.innerHTML='<div class="frwrap">'+tabs+note+body+'</div>';
  box.scrollTop=0;

  box.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click',function(){ state.frTab=b.getAttribute('data-tab'); renderFriends(); });
  });
  var qi=$('frQuery');
  function doSearch(){
    var raw=($('frQuery')&&$('frQuery').value)||'';
    state.frQuery=raw;                 // 记住输入，视图重绘后可恢复
    var q=raw.trim().toLowerCase(), res=$('frResult');
    if(!q){ res.innerHTML='<div class="fr-empty">输入账号后点搜索</div>'; return; }
    var found=Auth.directory().filter(function(u){ return u.uid!==me.uid && u.uid.indexOf(q)>=0; });
    if(!found.length){ res.innerHTML='<div class="fr-empty">没找到匹配的账号。可先退出注册一个新账号再来加好友。</div>'; return; }
    res.innerHTML='<div class="fr-sec">搜索结果（'+found.length+'）</div>'+found.map(function(u){
      var fr=Social.isFriend(me.uid,u.uid), sent=!!Social.pendingRequest(me.uid,u.uid);
      var op = fr ? '<span class="fr-btn" style="cursor:default">已是好友</span>'
        : sent ? '<span class="fr-btn" style="cursor:default">申请已发出</span>'
        : '<button class="fr-btn pri" data-add="'+esc(u.uid)+'" data-nick="'+esc(u.nickname)+'">加好友</button>';
      return '<div class="fr-row"><div class="fr-av">'+esc((u.nickname||'?').slice(0,1))+'</div>'
        +'<div class="fr-info"><div class="fr-nm">'+esc(u.nickname)+'</div><div class="fr-id">@'+esc(u.uid)+'</div></div>'
        +'<div class="fr-ops">'+op+'</div></div>';
    }).join('');
    res.querySelectorAll('[data-add]').forEach(function(b){
      b.addEventListener('click',function(){
        var r=Social.request(me,{uid:b.getAttribute('data-add'),nickname:b.getAttribute('data-nick')});
        if(!r.ok){ toast(r.error,'err'); return; }
        if(r.auto){ toast('对方也向你发过申请，已自动成为好友！','ok'); }else{ toast('好友申请已发出，等对方登录后在「申请」里同意','ok'); }
        renderFriends();               // 由 renderFriends 统一重绘，并自动恢复搜索结果
      });
    });
  }
  if($('frSearchBtn')) $('frSearchBtn').addEventListener('click',doSearch);
  if(qi){
    qi.addEventListener('input',function(){ state.frQuery=this.value; });  // 实时记住输入
    qi.addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });
  }
  // 视图被重绘后（切回本页 / 处理完申请），自动恢复上次的搜索词与结果
  if(tab==='find' && (state.frQuery||'').trim() && $('frResult')) doSearch();
  box.querySelectorAll('[data-accept],[data-reject]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-accept')||b.getAttribute('data-reject');
      var r=Social.respond(id, me, !!b.getAttribute('data-accept'));
      if(!r.ok){ toast(r.error,'err'); return; }
      renderFriends();
    });
  });
  box.querySelectorAll('[data-unfriend]').forEach(function(b){
    b.addEventListener('click',function(){
      confirmBox('确定删除这个好友吗？（会同时清除相关申请）', function(){
        Social.remove(me, b.getAttribute('data-unfriend'));
        toast('已删除该好友','ok');
        renderFriends();
      });
    });
  });
  box.querySelectorAll('[data-chat]').forEach(function(b){
    b.addEventListener('click',function(){
      openPm({uid:b.getAttribute('data-chat'),nickname:b.getAttribute('data-nick')});
    });
  });
}

/* extra 可选：{image, file, audio, dm:{to,toName}} —— 统一挂到消息对象上，与 ownerId 隔离并存 */
function send(text, kind, image, extra){
  if(!state.me){ return Promise.reject(new Error('请先登录')); }
  var r=Rate.check(state.me.id);
  if(!r.ok){
    $('tip').textContent='发送太频繁啦，请 '+r.wait+' 秒后再试（60 秒内最多 '+CFG.rateMax+' 条）';
    return Promise.resolve(false);
  }
  $('tip').textContent='';
  var msg = {
    mid:uid(), ownerId:state.me.id, ownerUid:state.me.uid, ownerName:state.me.nickname,
    content:text, kind:kind||'user', createdAt:nowISO()
  };
  if(image) msg.image=image;               // 图片：base64 dataURL
  if(extra){
    if(extra.file)  msg.file  = extra.file;   // 文件：{name,size,type,data}
    if(extra.audio) msg.audio = extra.audio; // 语音：{data,dur,mime,bytes}
    if(extra.sticker && STICKER_BY_ID[extra.sticker]) msg.sticker = extra.sticker; // 表情包：白名单 id
    if(extra.dm){ msg.dm=true; msg.toUid=extra.dm.to; msg.toName=extra.dm.toName; } // 私聊
  }
  return Store.add(msg).then(refresh).then(function(){ return true; });
}

/* ===== 发送文件 ===== */
function doSendFile(file){
  if(!state.me){ $('tip').textContent='请先登录'; return; }
  if(state.scope!=='all' && state.scope!=='dm'){ $('tip').textContent='请切回「群聊大厅」或进入私聊再发文件'; return; }
  $('btnFile').disabled=true; $('tip').textContent='读取文件中…';
  var dm = (state.scope==='dm' && state.pmPeer) ? {to:state.pmPeer.uid,toName:state.pmPeer.nickname} : null;
  FILE.read(file).then(function(f){
    $('tip').textContent='发送中…（'+FILE.kb(f.size)+'）';
    var cap=$('input').value.trim();
    return send(cap||'[文件] '+f.name, 'user', null, {file:f, dm:dm});
  }).then(function(ok){
    if(ok!==false){ $('input').value=''; $('input').style.height='auto'; }
    $('tip').textContent='';
  }).catch(function(e){
    $('tip').textContent='文件发送失败：'+((e&&e.message)||'未知错误');
  }).then(function(){ $('btnFile').disabled=false; $('fileAny').value=''; });
}

/* ===== 发送语音（录音或音频文件） ===== */
function doSendVoice(audio){
  if(!state.me){ $('tip').textContent='请先登录'; return; }
  if(state.scope!=='all' && state.scope!=='dm'){ $('tip').textContent='请切回「群聊大厅」或进入私聊再发语音'; return; }
  var dm = (state.scope==='dm' && state.pmPeer) ? {to:state.pmPeer.uid,toName:state.pmPeer.nickname} : null;
  $('tip').textContent='语音发送中…';
  send('[语音] '+audio.dur+'″', 'user', null, {audio:audio, dm:dm}).then(function(ok){
    if(ok!==false){ $('input').value=''; $('input').style.height='auto'; }
    $('tip').textContent='';
  }).catch(function(e){ $('tip').textContent='语音发送失败：'+((e&&e.message)||'未知错误'); });
}

/* 录音按钮：点一次开始，再点一次停止并发送；计时到上限自动停止 */
function toggleRecord(){
  if(VOICE.active){
    VOICE.stop().then(function(a){
      if(a.bytes > CFG.maxFileBytes){ throw new Error('录音超过 '+Math.round(CFG.maxFileBytes/1024)+'KB，请录短一点'); }
      if(Store.mode!=='cloud' && SafeLS.level()<2 && a.bytes > 180*1024){ throw new Error('当前浏览器存储受限，请录短一点（或填 env 用云端）'); }
      doSendVoice(a);
    }).catch(function(e){ $('tip').textContent='录音失败：'+((e&&e.message)||'未知错误'); });
    stopRecUI(); return;
  }
  $('btnVoice').disabled=true;
  VOICE.start().then(function(){
    VOICE.active=true; // start 内已置位，保险
    $('btnVoice').disabled=false; $('btnVoice').classList.add('on'); $('voiceLabel').textContent='停止';
    $('recHint').style.display='inline'; $('recHint').textContent='录音中 0s · 再点停止发送';
    $('tip').textContent='正在录音（麦克风）…';
    var s=0;
    VOICE.timer=setInterval(function(){
      s++;
      $('recHint').textContent='录音中 '+s+'s · 再点停止发送';
      if(s>=(CFG.maxVoiceSec||60)){ toggleRecord(); }
    },1000);
  }).catch(function(e){
    $('btnVoice').disabled=false; stopRecUI();
    // 预览面板 / 无权限时降级：让用户选择本地音频文件当语音发，保证任何环境都能演示
    var fallback='当前环境无法录音（麦克风被禁用或不支持）';
    $('tip').textContent=fallback;
    confirmBox('无法使用麦克风录音。\n\n是否改为「选择一个音频文件」作为语音消息发送？\n（预览面板常禁用麦克风，用这个方式也能完整演示语音功能）',
      function(){
        $('fileAudio').click();
        $('tip').textContent='已打开文件选择框：选一个 mp3/wav 即可作为语音消息发出';
      },
      function(){
        $('tip').textContent='已取消。可点「文件」上传音频，或发布到正式域名后使用麦克风';
      });
  });
}
function stopRecUI(){
  VOICE.active=false;
  if(VOICE.timer){ clearInterval(VOICE.timer); VOICE.timer=null; }
  $('btnVoice').classList.remove('on'); $('voiceLabel').textContent='语音';
  $('recHint').style.display='none'; $('tip').textContent='';
}

/* 音频文件降级：读成 base64，按估算时长生成语音消息 */
function doSendAudioFile(file){
  if(!file){ return; }
  $('tip').textContent='读取音频中…';
  FILE.read(file).then(function(f){
    // 无法精确解析时长，按体积粗估（约 16KB/s），至少 1 秒
    var dur=Math.max(1, Math.min(999, Math.round(f.size/16000)));
    doSendVoice({ data:f.data, dur:dur, mime:f.type||'audio/mpeg', bytes:f.size });
  }).catch(function(e){ $('tip').textContent='音频读取失败：'+((e&&e.message)||'未知错误'); })
    .then(function(){ $('fileAudio').value=''; });
}

/* 发送图片：压缩后作为图片消息发出，可附带输入框里的文字作为说明 */
function doSendImage(file){
  if(!state.me){ $('tip').textContent='请先登录'; return; }
  if(state.scope!=='all' && state.scope!=='dm'){ $('tip').textContent='请切回「群聊大厅」或进入私聊再发图片'; return; }
  var dm = (state.scope==='dm' && state.pmPeer) ? {to:state.pmPeer.uid,toName:state.pmPeer.nickname} : null;
  $('btnImg').disabled=true;
  $('tip').textContent='图片压缩中…';
  IMG.read(file).then(function(info){
    // 本地模式配额保护：避免超出存储上限导致整批消息写入失败
    if(Store.mode!=='cloud' && SafeLS.level()<2 && info.bytes>800*1024){
      throw new Error('图片太大且当前浏览器存储受限，请换小图或改用云端模式');
    }
    var cap=$('input').value.trim();
    var text = cap || '[图片]';
    $('tip').textContent='发送中…（约 '+Math.round(info.bytes/1024)+'KB）';
    return send(text, 'user', info.dataURL, {dm:dm});
  }).then(function(ok){
    if(ok!==false){ $('input').value=''; $('input').style.height='auto'; }
    $('tip').textContent='';
  }).catch(function(e){
    $('tip').textContent='图片发送失败：'+((e&&e.message)||'未知错误');
  }).then(function(){
    $('btnImg').disabled=false;
    $('fileImg').value=''; // 允许重复选同一张
  });
}

/* @小星 触发：消息里带这个词才让 Coze 接话，普通聊天不会误触发 */
var MENTION='@小星';
function hasMention(text){ return String(text||'').indexOf(MENTION)>=0; }
function cleanMention(text){ // 传给 Coze 时去掉触发词，避免 AI 看到这个标记
  return String(text||'').split(MENTION).join('').replace(/\s+/g,' ').trim();
}

function doSend(){
  var el=$('input'), text=el.value.trim();
  if(!text) return;
  var isDm = state.scope==='dm';
  if(state.scope!=='all' && !isDm){
    $('tip').textContent = state.scope==='db' ? '当前是「数据库」视图，请切回群聊大厅发消息'
      : state.scope==='friends' ? '当前是「好友」视图，请点好友的「💬 私聊」或切回群聊大厅'
      : '当前是「个人」视图，请切回群聊大厅发消息';
    return;
  }
  if(!isDm && hasMention(text)){ askAI(text); return; } // 群聊里带 @小星 → 走 Coze
  var dm = isDm && state.pmPeer ? {to:state.pmPeer.uid,toName:state.pmPeer.nickname} : null;
  $('btnSend').disabled=true;
  Promise.resolve(send(text,'user',null,{dm:dm})).then(function(ok){
      if(ok!==false){
        el.value=''; el.style.height='auto';
        var sb=$('btnSend'); sb.classList.remove('sent'); void sb.offsetWidth; sb.classList.add('sent');
      }
    })
    .catch(function(e){ $('tip').textContent='发送失败：'+(e&&e.message?e.message:'未知错误'); })
    .then(function(){ $('btnSend').disabled=false; el.focus(); });
}

/* 构建对话历史：取当前用户的最近若干轮 user/ai 消息，作为上下文随问题发给扣子。
   只取本人 + 小星的消息，避免把别人的群聊内容当成本人的记忆。 */
function buildHistory(meId, excludeMid){
  return Store.list().then(function(list){
    var picked=[];
    for(var i=0;i<list.length;i++){
      var m=list[i];
      if(m.mid===excludeMid || m.dm || m.kind==='profile' || m.kind==='social') continue; // 私聊/账号/关系记录不进群聊上下文
      var isMine = m.kind==='user' && m.ownerId===meId;
      var isAI = m.kind==='ai';
      if(!isMine && !isAI) continue;
      var c=String(m.content||'').trim();
      if(!c || c==='[图片]' || c.indexOf('[文件]')===0 || c.indexOf('[语音]')===0 || c.indexOf('[表情包]')===0) continue;
      picked.push({ role: isAI?'assistant':'user', content:c.slice(0,300) });
    }
    return picked.slice(-10); // 最近 10 条（约 5 轮）
  }).catch(function(){ return []; });
}

// preset：从 doSend 传入的原文（含 @小星）；按钮点击时不传，直接读输入框
function askAI(preset){
  var el=$('input');
  var raw = (typeof preset==='string' && preset.trim()) ? preset.trim() : el.value.trim();
  if(!raw){ $('tip').textContent='先在输入框写点内容，带上 @小星 发出去，小星就会接话'; el.focus(); return; }
  if(state.scope!=='all'){ $('tip').textContent='当前视图不能找小星，请切回「群聊大厅」'; return; }
  if(state.asking) return;
  var question = cleanMention(raw) || raw; // 去掉触发词；若只剩触发词则原样问
  state.asking=true; $('tip').textContent='小星思考中…（首次调用约需 3~10 秒）'; $('btnSend').disabled=true;
  refresh();   // 立即显示「正在输入」气泡
  var uidAI = state.me ? state.me.id : 'guest';
  // 先抓历史（此时当前问题还没入库），再发问题、带着历史调 AI
  buildHistory(uidAI, null)
    .then(function(history){
      return send(raw,'user').then(function(ok){ // 原文入库（含 @小星）
        if(ok===false) throw new Error('rate-limited'); // 被限流则不调 AI
        return AI.answer(question, uidAI, history);
      });
    })
    .then(function(ans){
      return Store.add({ mid:uid(), ownerId:'ai', ownerName:'小星 · Coze', content:ans, kind:'ai', createdAt:nowISO() });
    })
    .then(function(){ el.value=''; el.style.height='auto'; $('tip').textContent=''; refresh(); })
    .catch(function(e){
      $('tip').textContent = (e && e.message==='rate-limited')
        ? '' : ('小星开小差了：'+((e&&e.message)||'未知错误'));
    })
    .then(function(){ state.asking=false; $('btnSend').disabled=false; });
}

function switchScope(scope){
  state.scope=scope;
  $('navAll').classList.toggle('active',scope==='all');
  $('navMine').classList.toggle('active',scope==='mine');
  $('navDb').classList.toggle('active',scope==='db');
  $('navFriends').classList.toggle('active',scope==='friends');
  $('navPm').classList.toggle('active',scope==='dm');
  // 保留 pmPeer：从私聊切到别处后，侧栏「💬 私聊」仍可一键回到刚才的对话
  $('navPm').style.display = state.pmPeer ? '' : 'none';
  var titles={all:'群聊大厅',mine:'个人',db:'数据库',friends:'好友',dm:'私聊'};
  var descs={
    all:'和群里的小伙伴聊点什么吧 · 可发图片 / 文件 / 语音',
    mine:'这里只有你发过的消息',
    db:'三张原始表：消息表 / 账号表 / 好友关系表，可直接给老师检查',
    friends:'搜索用户、处理好友申请、发起私聊',
    dm: state.pmPeer ? ('与 '+state.pmPeer.nickname+' 的私密对话 · 群聊大厅看不到') : '私聊'
  };
  $('chatTitle').textContent = titles[scope]||'群聊大厅';
  $('chatDesc').textContent = descs[scope]||'';
  var mb=$('msgs'); mb.classList.remove('swap'); void mb.offsetWidth; mb.classList.add('swap');
  LAST_SCOPE=null;   // 切换视图后回到最新消息
  refresh();
}

/* 进入与某好友的私聊 */
function openPm(peer){
  if(!Social.isFriend(state.me.uid, peer.uid)){ toast('对方还不是你的好友，请先加好友','err'); return; }
  state.pmPeer=peer; state.frTab='friends';
  switchScope('dm');
}

function showView(name){
  var reg = name==='reg';
  $('loginView').style.display = reg?'none':'block';
  $('regView').style.display   = reg?'block':'none';
  $('entryErr').textContent=''; $('regErr').textContent='';
}

function exitChat(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  if(state._audio){ try{ state._audio.pause(); }catch(e){} state._audio=null; }
  if(VOICE.active){ VOICE.cancel(); stopRecUI(); }
  try{ SafeLS.removeItem('spark_chat_me'); }catch(e){}
  state.me=null; state.scope='all'; state.pmPeer=null; state.frTab='friends'; state.frQuery='';
  $('navPm').style.display='none';
  $('chat').style.display='none'; $('entry').style.display='flex';
  $('loginUser').value=''; $('loginPass').value=''; $('entryErr').textContent='';
  $('regUser').value=''; $('regPass').value=''; $('regPass2').value=''; $('regNick').value='';
  showView('login');
}

function loadCloudSDK(cb){
  if(typeof window.cloudbase!=='undefined'){ cb(true); return; }
  var s=document.createElement('script');
  s.src='https://static.cloudbase.net/cloudbase-js-sdk/2.7.1/cloudbase.full.js';
  s.onload=function(){ cb(true); }; s.onerror=function(){ cb(false); };
  document.head.appendChild(s);
}

/* 启动 */
document.addEventListener('DOMContentLoaded',function(){
  initTheme();
  initBubble();
  initPet();
  $('btnTheme').addEventListener('click',toggleTheme);
  $('btnThemeEntry').addEventListener('click',toggleTheme);
  $('btnBubble').addEventListener('click',function(){ closeStickerPop(); toggleBubblePop(); });
  // 表情包面板
  $('btnSticker').addEventListener('click',function(){ closeBubblePop(); toggleStickerPop(); });
  $('spClose').addEventListener('click',closeStickerPop);
  document.querySelectorAll('[data-sptab]').forEach(function(b){
    b.addEventListener('click',function(){ switchStickerTab(b.getAttribute('data-sptab')); });
  });
  $('spEmoji').addEventListener('click',function(e){
    var b=e.target.closest && e.target.closest('[data-emoji]');
    if(b) insertEmoji(b.getAttribute('data-emoji'));
  });
  $('spPack').addEventListener('click',function(e){
    var b=e.target.closest && e.target.closest('[data-sticker]');
    if(b) sendSticker(b.getAttribute('data-sticker'));
  });
  // 悬浮小星
  $('petHide').addEventListener('click',hidePet);
  $('petRestore').addEventListener('click',showPet);
  $('petAsk').addEventListener('click',petQuickAsk);
  // 点面板外任意处 / 按 Esc 收起两个弹出面板
  document.addEventListener('pointerdown',function(e){
    var bw=document.querySelector('.bubble-wrap');
    if(bw && !bw.contains(e.target)) closeBubblePop();
    var sw=document.querySelector('.sticker-wrap');
    if(sw && !sw.contains(e.target)) closeStickerPop();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ closeBubblePop(); closeStickerPop(); }
  });
  $('modalOk').addEventListener('click',function(){ closeModal(true); });
  $('modalCancel').addEventListener('click',function(){ closeModal(false); });
  $('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(false); });
  document.addEventListener('pointerdown',rippleDelegate);
  function bootstrap(){
    Store.init().then(function(){
      setModeUI();
      // 云端模式：先读一次云端目录，再把本机已有账号补上去（避免重复写入）
      if(Store.mode==='cloud'){
        Store.list().then(function(all){ CloudSync.absorb(all); CloudSync.publishLocalUsers(); })
          .catch(function(e){ console.warn('云端账号目录同步失败：',e); });
      }
      // 恢复上次登录的账号（仅填账号，密码需重新输入）
      try{
        var m=JSON.parse(SafeLS.getItem('spark_chat_me')||'null');
        if(m && m.username){ $('loginUser').value=m.username; }
      }catch(e){}
    });
  }
  if(CFG.env) loadCloudSDK(bootstrap); else bootstrap();

  $('goRegister').addEventListener('click',function(){ showView('reg'); $('regUser').focus(); });
  $('goLogin').addEventListener('click',function(){ showView('login'); $('loginUser').focus(); });

  $('btnEnter').addEventListener('click',function(){
    var account=$('loginUser').value.trim();
    var pass=$('loginPass').value;
    if(!account){ $('entryErr').textContent='请输入账号'; return; }
    if(pass.length<4){ $('entryErr').textContent='密码至少 4 位'; return; }
    var r=Auth.login(account, pass);
    if(!r.ok){ $('entryErr').textContent=r.error; return; }
    $('entryErr').textContent='';
    $('btnEnter').disabled=true;
    enter(r.me);
    $('btnEnter').disabled=false;
  });
  ['loginUser','loginPass'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') $('btnEnter').click(); });
  });

  $('btnRegister').addEventListener('click',function(){
    var account=$('regUser').value.trim();
    var pass=$('regPass').value;
    var pass2=$('regPass2').value;
    var nick=$('regNick').value.trim();
    if(!account){ $('regErr').textContent='请输入账号'; return; }
    if(pass.length<4){ $('regErr').textContent='密码至少 4 位'; return; }
    if(pass!==pass2){ $('regErr').textContent='两次密码不一致'; return; }
    var r=Auth.register(account, pass, nick);
    if(!r.ok){ $('regErr').textContent=r.error; return; }
    $('regErr').textContent='';
    $('btnRegister').disabled=true;
    enter(r.me);
    $('btnRegister').disabled=false;
  });
  ['regUser','regPass','regPass2','regNick'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') $('btnRegister').click(); });
  });
  $('btnSend').addEventListener('click',doSend);
  $('btnImg').addEventListener('click',function(){ $('fileImg').click(); });
  $('fileImg').addEventListener('change',function(){
    if(this.files && this.files[0]) doSendImage(this.files[0]);
  });
  // 上传文件
  $('btnFile').addEventListener('click',function(){ $('fileAny').click(); });
  $('fileAny').addEventListener('change',function(){
    if(this.files && this.files[0]) doSendFile(this.files[0]);
  });
  // 语音：录音按钮 + 音频文件降级通道
  $('btnVoice').addEventListener('click',toggleRecord);
  $('fileAudio').addEventListener('change',function(){
    if(this.files && this.files[0]) doSendAudioFile(this.files[0]);
  });
  $('lightbox').addEventListener('click',function(){
    this.style.display='none'; this.classList.remove('show'); $('lightboxImg').src='';
  });
  $('navAi').addEventListener('click',function(){
    // 点按钮 = 自动给当前输入加上 @小星 并发送，与手打 @小星 走同一条逻辑
    var el=$('input'), v=el.value.trim();
    if(!v){ $('tip').textContent='先在输入框写点内容，点小星会自动帮你 @ 它'; el.focus(); return; }
    if(!hasMention(v)) el.value = MENTION+' '+v;
    askAI();
  });
  $('navAll').addEventListener('click',function(){ switchScope('all'); });
  $('navMine').addEventListener('click',function(){ switchScope('mine'); });
  $('navDb').addEventListener('click',function(){ switchScope('db'); });
  $('navFriends').addEventListener('click',function(){ switchScope('friends'); });
  $('navPm').addEventListener('click',function(){ if(state.pmPeer) switchScope('dm'); });
  $('btnExit').addEventListener('click',exitChat);
  $('input').addEventListener('compositionstart',function(){ state.composing=true; });
  $('input').addEventListener('compositionend',function(){ state.composing=false; });
  $('input').addEventListener('keydown',function(e){
    // 中文输入法组词中按 Enter 是「确认候选字」，不能当成发送，否则看起来像没反应
    if(state.composing || e.isComposing || e.keyCode===229) return;
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  $('input').addEventListener('input',function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px';
  });
});
})();
