    $('tip').textContent='图片发送失败：'+((e&&e.message)||'未知错误');
  }).then(function(){
    $('btnImg').disabled=false;
    $('fileImg').value=''; // 允许重复选同一张
  });
}

/* @小星 触发：消息里带这个词才让 Coze 接话，普通聊天不会误触发 */
var MENTION='@小星';
function hasMention(text){ return String(text||'').indexOf(MENTION)>=0; }
function cleanMention(text){ // 传给 Coze 时去掉触发词，避免 AI 看到这个标记
  return String(text||'').split(MENTION).join('').replace(/\s+/g,' ').trim();
}

function doSend(){
  var el=$('input'), text=el.value.trim();
  if(!text) return;
  var isDm = state.scope==='dm';
  if(state.scope!=='all' && !isDm){
    $('tip').textContent = state.scope==='db' ? '当前是「数据库」视图，请切回群聊大厅发消息'
      : state.scope==='friends' ? '当前是「好友」视图，请点好友的「💬 私聊」或切回群聊大厅'
      : '当前是「个人」视图，请切回群聊大厅发消息';
    return;
  }
  if(!isDm && hasMention(text)){ askAI(text); return; } // 群聊里带 @小星 → 走 Coze
  var dm = isDm && state.pmPeer ? {to:state.pmPeer.uid,toName:state.pmPeer.nickname} : null;
  $('btnSend').disabled=true;
  Promise.resolve(send(text,'user',null,{dm:dm})).then(function(ok){
      if(ok!==false){
        el.value=''; el.style.height='auto';
        var sb=$('btnSend'); sb.classList.remove('sent'); void sb.offsetWidth; sb.classList.add('sent');
      }
    })
    .catch(function(e){ $('tip').textContent='发送失败：'+(e&&e.message?e.message:'未知错误'); })
    .then(function(){ $('btnSend').disabled=false; el.focus(); });
}

/* 构建对话历史：取当前用户的最近若干轮 user/ai 消息，作为上下文随问题发给扣子。
   只取本人 + 小星的消息，避免把别人的群聊内容当成本人的记忆。 */
function buildHistory(meId, excludeMid){
  return Store.list().then(function(list){
    var picked=[];
    for(var i=0;i<list.length;i++){
      var m=list[i];
      if(m.mid===excludeMid || m.dm || m.kind==='profile' || m.kind==='social') continue; // 私聊/账号/关系记录不进群聊上下文
      var isMine = m.kind==='user' && m.ownerId===meId;
      var isAI = m.kind==='ai';
      if(!isMine && !isAI) continue;
      var c=String(m.content||'').trim();
      if(!c || c==='[图片]' || c.indexOf('[文件]')===0 || c.indexOf('[语音]')===0) continue;
      picked.push({ role: isAI?'assistant':'user', content:c.slice(0,300) });
    }
    return picked.slice(-10); // 最近 10 条（约 5 轮）
  }).catch(function(){ return []; });
}

// preset：从 doSend 传入的原文（含 @小星）；按钮点击时不传，直接读输入框
function askAI(preset){
  var el=$('input');
  var raw = (typeof preset==='string' && preset.trim()) ? preset.trim() : el.value.trim();
  if(!raw){ $('tip').textContent='先在输入框写点内容，带上 @小星 发出去，小星就会接话'; el.focus(); return; }
  if(state.scope!=='all'){ $('tip').textContent='当前视图不能找小星，请切回「群聊大厅」'; return; }
  if(state.asking) return;
  var question = cleanMention(raw) || raw; // 去掉触发词；若只剩触发词则原样问
  state.asking=true; $('tip').textContent='小星思考中…（首次调用约需 3~10 秒）'; $('btnSend').disabled=true;
  refresh();   // 立即显示「正在输入」气泡
  var uidAI = state.me ? state.me.id : 'guest';
  // 先抓历史（此时当前问题还没入库），再发问题、带着历史调 AI
  buildHistory(uidAI, null)
    .then(function(history){
      return send(raw,'user').then(function(ok){ // 原文入库（含 @小星）
        if(ok===false) throw new Error('rate-limited'); // 被限流则不调 AI
        return AI.answer(question, uidAI, history);
      });
    })
    .then(function(ans){
      return Store.add({ mid:uid(), ownerId:'ai', ownerName:'小星 · Coze', content:ans, kind:'ai', createdAt:nowISO() });
    })
    .then(function(){ el.value=''; el.style.height='auto'; $('tip').textContent=''; refresh(); })
    .catch(function(e){
      $('tip').textContent = (e && e.message==='rate-limited')
        ? '' : ('小星开小差了：'+((e&&e.message)||'未知错误'));
    })
    .then(function(){ state.asking=false; $('btnSend').disabled=false; });
}

function switchScope(scope){
  state.scope=scope;
  $('navAll').classList.toggle('active',scope==='all');
  $('navMine').classList.toggle('active',scope==='mine');
  $('navDb').classList.toggle('active',scope==='db');
  $('navFriends').classList.toggle('active',scope==='friends');
  $('navPm').classList.toggle('active',scope==='dm');
  // 保留 pmPeer：从私聊切到别处后，侧栏「💬 私聊」仍可一键回到刚才的对话
  $('navPm').style.display = state.pmPeer ? '' : 'none';
  var titles={all:'群聊大厅',mine:'个人',db:'数据库',friends:'好友',dm:'私聊'};
  var descs={
    all:'和群里的小伙伴聊点什么吧 · 可发图片 / 文件 / 语音',
    mine:'这里只有你发过的消息',
    db:'三张原始表：消息表 / 账号表 / 好友关系表，可直接给老师检查',
    friends:'搜索用户、处理好友申请、发起私聊',
    dm: state.pmPeer ? ('与 '+state.pmPeer.nickname+' 的私密对话 · 群聊大厅看不到') : '私聊'
  };
  $('chatTitle').textContent = titles[scope]||'群聊大厅';
  $('chatDesc').textContent = descs[scope]||'';
  var mb=$('msgs'); mb.classList.remove('swap'); void mb.offsetWidth; mb.classList.add('swap');
  LAST_SCOPE=null;   // 切换视图后回到最新消息
  refresh();
}

/* 进入与某好友的私聊 */
function openPm(peer){
  if(!Social.isFriend(state.me.uid, peer.uid)){ toast('对方还不是你的好友，请先加好友','err'); return; }
  state.pmPeer=peer; state.frTab='friends';
  switchScope('dm');
}

function showView(name){
  var reg = name==='reg';
  $('loginView').style.display = reg?'none':'block';
  $('regView').style.display   = reg?'block':'none';
  $('entryErr').textContent=''; $('regErr').textContent='';
}

function exitChat(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  if(state._audio){ try{ state._audio.pause(); }catch(e){} state._audio=null; }
  if(VOICE.active){ VOICE.cancel(); stopRecUI(); }
  try{ SafeLS.removeItem('spark_chat_me'); }catch(e){}
  state.me=null; state.scope='all'; state.pmPeer=null; state.frTab='friends'; state.frQuery='';
  $('navPm').style.display='none';
  $('chat').style.display='none'; $('entry').style.display='flex';
  $('loginUser').value=''; $('loginPass').value=''; $('entryErr').textContent='';
  $('regUser').value=''; $('regPass').value=''; $('regPass2').value=''; $('regNick').value='';
  showView('login');
}

function loadCloudSDK(cb){
  if(typeof window.cloudbase!=='undefined'){ cb(true); return; }
  var s=document.createElement('script');
  s.src='https://static.cloudbase.net/cloudbase-js-sdk/2.7.1/cloudbase.full.js';
  s.onload=function(){ cb(true); }; s.onerror=function(){ cb(false); };
  document.head.appendChild(s);
}

/* 启动 */
document.addEventListener('DOMContentLoaded',function(){
  initTheme();
  initBubble();
  $('btnTheme').addEventListener('click',toggleTheme);
  $('btnThemeEntry').addEventListener('click',toggleTheme);
  $('btnBubble').addEventListener('click',function(){ toggleBubblePop(); });
  // 点面板外任意处 / 按 Esc 收起气泡选择面板
  document.addEventListener('pointerdown',function(e){
    var w=document.querySelector('.bubble-wrap');
    if(w && !w.contains(e.target)) closeBubblePop();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeBubblePop(); });
  $('modalOk').addEventListener('click',function(){ closeModal(true); });
  $('modalCancel').addEventListener('click',function(){ closeModal(false); });
  $('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(false); });
  document.addEventListener('pointerdown',rippleDelegate);
  function bootstrap(){
    Store.init().then(function(){
      setModeUI();
      // 云端模式：先读一次云端目录，再把本机已有账号补上去（避免重复写入）
      if(Store.mode==='cloud'){
        Store.list().then(function(all){ CloudSync.absorb(all); CloudSync.publishLocalUsers(); })
          .catch(function(e){ console.warn('云端账号目录同步失败：',e); });
      }
      // 恢复上次登录的账号（仅填账号，密码需重新输入）
      try{
        var m=JSON.parse(SafeLS.getItem('spark_chat_me')||'null');
        if(m && m.username){ $('loginUser').value=m.username; }
      }catch(e){}
    });
  }
  if(CFG.env) loadCloudSDK(bootstrap); else bootstrap();

  $('goRegister').addEventListener('click',function(){ showView('reg'); $('regUser').focus(); });
  $('goLogin').addEventListener('click',function(){ showView('login'); $('loginUser').focus(); });

  $('btnEnter').addEventListener('click',function(){
    var account=$('loginUser').value.trim();
    var pass=$('loginPass').value;
    if(!account){ $('entryErr').textContent='请输入账号'; return; }
    if(pass.length<4){ $('entryErr').textContent='密码至少 4 位'; return; }
    var r=Auth.login(account, pass);
    if(!r.ok){ $('entryErr').textContent=r.error; return; }
    $('entryErr').textContent='';
    $('btnEnter').disabled=true;
    enter(r.me);
    $('btnEnter').disabled=false;
  });
  ['loginUser','loginPass'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') $('btnEnter').click(); });
  });

  $('btnRegister').addEventListener('click',function(){
    var account=$('regUser').value.trim();
    var pass=$('regPass').value;
    var pass2=$('regPass2').value;
    var nick=$('regNick').value.trim();
    if(!account){ $('regErr').textContent='请输入账号'; return; }
    if(pass.length<4){ $('regErr').textContent='密码至少 4 位'; return; }
    if(pass!==pass2){ $('regErr').textContent='两次密码不一致'; return; }
    var r=Auth.register(account, pass, nick);
    if(!r.ok){ $('regErr').textContent=r.error; return; }
    $('regErr').textContent='';
    $('btnRegister').disabled=true;
    enter(r.me);
    $('btnRegister').disabled=false;
  });
  ['regUser','regPass','regPass2','regNick'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') $('btnRegister').click(); });
  });
  $('btnSend').addEventListener('click',doSend);
  $('btnImg').addEventListener('click',function(){ $('fileImg').click(); });
  $('fileImg').addEventListener('change',function(){
    if(this.files && this.files[0]) doSendImage(this.files[0]);
  });
  // 上传文件
  $('btnFile').addEventListener('click',function(){ $('fileAny').click(); });
  $('fileAny').addEventListener('change',function(){
    if(this.files && this.files[0]) doSendFile(this.files[0]);
  });
  // 语音：录音按钮 + 音频文件降级通道
  $('btnVoice').addEventListener('click',toggleRecord);
  $('fileAudio').addEventListener('change',function(){
    if(this.files && this.files[0]) doSendAudioFile(this.files[0]);
  });
  $('lightbox').addEventListener('click',function(){
    this.style.display='none'; this.classList.remove('show'); $('lightboxImg').src='';
  });
  $('navAi').addEventListener('click',function(){
    // 点按钮 = 自动给当前输入加上 @小星 并发送，与手打 @小星 走同一条逻辑
    var el=$('input'), v=el.value.trim();
    if(!v){ $('tip').textContent='先在输入框写点内容，点小星会自动帮你 @ 它'; el.focus(); return; }
    if(!hasMention(v)) el.value = MENTION+' '+v;
    askAI();
  });
  $('navAll').addEventListener('click',function(){ switchScope('all'); });
  $('navMine').addEventListener('click',function(){ switchScope('mine'); });
  $('navDb').addEventListener('click',function(){ switchScope('db'); });
  $('navFriends').addEventListener('click',function(){ switchScope('friends'); });
  $('navPm').addEventListener('click',function(){ if(state.pmPeer) switchScope('dm'); });
  $('btnExit').addEventListener('click',exitChat);
  $('input').addEventListener('compositionstart',function(){ state.composing=true; });
  $('input').addEventListener('compositionend',function(){ state.composing=false; });
  $('input').addEventListener('keydown',function(e){
    // 中文输入法组词中按 Enter 是「确认候选字」，不能当成发送，否则看起来像没反应
    if(state.composing || e.isComposing || e.keyCode===229) return;
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  $('input').addEventListener('input',function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px';
  });
});
})();
</script>
